[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valwr"
version = "1.0.0"
description = "Predicts VALORANT match outcomes and rates every player in the lobby before the round starts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Fahran Alam" }]
keywords = ["valorant", "esports", "machine-learning", "prediction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment :: First Person Shooters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Floors rather than pins, matching requirements.txt. The one worth explaining:
# joblib's pickle loader uses a NumPy API deprecated in 2.5, and the live path
# loads that bundle on every start, so the floor moves when upstream fixes it.
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "joblib>=1.4",
    "websockets>=12.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psutil>=5.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Model comparison and the diagnostic plots. Not needed to run the dashboard.
research = ["xgboost>=2.1", "shap>=0.45", "matplotlib>=3.9"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/Fahran-Alam/valorant-winrate-predictor"

[tool.setuptools.packages.find]
include = ["valwr*"]

[tool.pytest.ini_options]
testpaths = ["test"]
filterwarnings = [
    # joblib -> numpy, see the dependency note above. Ours to fix when it is.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. This project's style is a considered one -- long
# explanatory comments, prose docstrings, deliberate blank lines -- and a
# linter's opinions about that are noise. What is worth failing a build over
# is code that is actually wrong:
#
#   E9  syntax and runtime errors
#   F   pyflakes: undefined names, unused imports, shadowed builtins
#   B   bugbear: mutable defaults, unused loop variables, except-pass
#
# Formatting rules are omitted on purpose, not forgotten.
select = ["E9", "F", "B"]
ignore = [
    "B008",   # function call in a default argument -- used deliberately here
    "B905",   # zip() without strict= -- fine on equal-length sequences
]

[tool.ruff.lint.per-file-ignores]
# Tools and tests put `sys.path.insert(0, ".")` before their imports so they
# run from the repository root without installing anything.
"tools/*.py" = ["E402"]
"test/*.py" = ["E402"]
