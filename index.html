<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>valwr live — broadcast — interactive demo</title>
<style>
/* ==========================================================================
   Palette taken from VALORANT's own UI rather than invented: the signature
   red, the deep desaturated navy the menus sit on, and the warm off-white
   Riot uses for type. Attack red / defend cyan is the in-game side language.

   Type is Bahnschrift -- Microsoft's DIN, already installed on Windows -- for
   the condensed uppercase that game reads in, with Segoe UI carrying body
   text. Nothing is fetched: this page must not make a network request while
   you are loading into a match, which is the same reason the agent art is
   downloaded ahead of time rather than hotlinked.
   ========================================================================== */
:root{
  /* One palette. Panels are near-opaque so they carry their own readability,
     which is what lets the scrim over the map stay light -- an earlier version
     dimmed the page to 93% black to protect the type and buried the artwork
     along with it. */
  --void:#070a0e; --steel:rgba(10,15,22,.90); --steel-2:rgba(17,25,35,.90);
  --sunk:rgba(6,9,13,.84);
  --line:rgba(140,175,200,.30); --line-soft:rgba(140,175,200,.16);
  --bone:#f4f7fa; --bone-dim:#bccbd7; --slate:#8fa2b1; --ghost:#63727f;
  --val:#ff4655; --atk:#ff5865; --def:#38d8e4; --val-deep:#3d1218;
  --gold:#e7c27d; --win:#3ad6a0;
  --display:"Bahnschrift","DIN Alternate","Oswald","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
}

/* ==========================================================================
   THEMES.  Every one of these redefines tokens only -- no component below
   names a colour directly, so a theme cannot half-apply and leave one panel
   in the previous palette. `midnight` is the set above and stays the default;
   the others are additive and reversible from the picker in the header.
   ========================================================================== */

/* --- the map behind everything ----------------------------------------
   The map's own key art, blurred and dimmed hard enough that type still
   passes contrast on it, with the panels frosted so the art reads through.
   --mapart is set from JS per match; with no art the gradient alone stands. */

/* Two layers, and the order matters. The vignette darkens the edges where
   type sits closest to the artwork and stays light through the middle, so the
   map is legible as a place rather than as texture. Blur is 3px, not 11 --
   enough to keep detail from competing with small text, not so much that
   Ascent stops looking like Ascent. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  backdrop-filter:blur(3px) saturate(1.14) contrast(1.04);
  background:
    radial-gradient(128% 86% at 50% 14%,
      rgba(5,8,12,.16) 0%, rgba(5,8,12,.44) 46%, rgba(5,8,12,.80) 100%),
    linear-gradient(180deg, rgba(5,8,12,.18) 0%, rgba(5,8,12,.36) 55%,
      rgba(5,8,12,.62) 100%)}
/* Roughly 30% darkened behind the map name and 92% at the lower corners. The
   bright maps -- Breeze, Sunset -- are what set the top figure: any lighter
   and the small uppercase subheading stops holding against sand. */

/* The page gets more air in this theme than the others, because the gaps are
   where the map is actually seen. */
body .shell{padding:26px 30px 72px}
body .grid{gap:26px}
.rosters{gap:22px}
body .team{margin-bottom:26px}
body .row{margin-bottom:7px}

body .row,body .panel,
body .fx{backdrop-filter:blur(9px) saturate(1.1);
  box-shadow:0 6px 22px rgba(0,0,0,.42)}
/* The agent art inside a row now has the map behind it as well, so it steps
   back to keep the two from fighting. */
body .art{opacity:.34}
body .row.known{border-top:1px solid rgba(255,255,255,.05)}

/* Header type sits directly on the artwork, so it carries its own shadow
   rather than relying on the scrim. */
body .map{
  text-shadow:0 2px 4px rgba(0,0,0,.55),0 6px 30px rgba(0,0,0,.85)}
body .mapsub,body .brand,
body .verdict{text-shadow:0 1px 10px rgba(0,0,0,.9)}
body .top{border-bottom-color:rgba(160,195,220,.26)}

/* --- the two teams sit side by side, so the map shows between them ---
   ...but only when each column can still show a name. A row spends about 400px
   on its score and four stats before the name gets any width, and the space the
   rosters get is set by the detail panel beside them (380 or 716px), not by the
   window. A media query on the window picked side by side at every desktop
   width, and at 1600px the name column collapsed to nothing. So this is asked
   of the rosters' own container: side by side with tighter stat columns when
   there is room for names, one team above the other when there is not. */
.grid>div:first-child{container-type:inline-size}
.rosters{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
/* Two columns only when each of them is genuinely wide enough. At 900 the
   container splits into halves of about 440px, and the row template spends
   52px on the score plus four 56px stat columns before the name gets any --
   so names and reasons ellipsis out. It looked fine in every captured
   screenshot because the capture guard only asked for 90px of name. */
@container (min-width:1180px){
  .rosters{grid-template-columns:1fr 1fr}
  .rosters .row{grid-template-columns:52px minmax(0,1fr) repeat(4,56px);
    gap:8px;padding-right:12px}
  .rosters .score{font-size:27px;padding-left:10px}
  .rosters .st b{font-size:15.5px}
  .rosters .st span{letter-spacing:.1em}
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background-color:var(--void);color:var(--bone);
  font:15px/1.5 var(--body);
  /* The map being played, set from the state as `--mapart`.
     This lives in the base rule rather than a later one on purpose. It used
     to sit in its own `body{...}` block above, which lost outright: this rule
     comes later in the sheet, and both `background:` and `background-image:`
     here reset it to the weave. Equal specificity, so source order decided,
     and the map never painted. */
  background-image:var(--mapart,none);
  background-size:cover;
  background-position:center 26%;
  background-attachment:fixed;
  background-repeat:no-repeat;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.disp{font-family:var(--display);font-stretch:condensed;letter-spacing:.02em}

.shell{max-width:1760px;margin:0 auto;padding:20px 22px 64px}
/* A 2560-wide display was showing a 1760 shell with the rosters crushed into
   two narrow columns inside it. Past this width there is room for both. */
@media(min-width:1980px){.shell{max-width:2040px}}

/* ---------- header ------------------------------------------------------ */
.top{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:600 11px/1 var(--display);
  letter-spacing:.34em;text-transform:uppercase;color:var(--slate)}
.pulse{width:6px;height:6px;background:var(--win);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pulse.off{background:var(--val)}
.mapwrap{flex:1;min-width:240px}
.map{font-family:var(--display);font-stretch:condensed;font-weight:700;
  font-size:58px;line-height:.9;letter-spacing:.01em;text-transform:uppercase;
  margin:6px 0 0}
.mapsub{color:var(--slate);font:600 10.5px/1 var(--display);letter-spacing:.24em;
  text-transform:uppercase;margin-top:8px}
.mapsub b{color:var(--bone-dim);font-weight:600}

/* the odds strip -- angled ends, the way Riot cuts every bar in the game */
.odds{margin-top:18px}
.oddsbar{display:flex;height:36px;overflow:hidden;
  clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.oddsbar div{display:flex;align-items:center;padding:0 15px;
  font-family:var(--display);font-stretch:condensed;font-weight:700;
  font-size:17px;letter-spacing:.06em;color:#080d12;
  transition:width .5s cubic-bezier(.4,0,.2,1)}
.oddsbar .atk{background:var(--atk)}
.oddsbar .def{background:var(--def);justify-content:flex-end}
.verdict{margin-top:8px;color:var(--bone-dim);font-size:12.5px}
.verdict b{text-transform:uppercase;letter-spacing:.06em}
.callrec{margin-top:5px;color:var(--bone-dim);font-size:12px;line-height:1.45;
  max-width:62em}
.verdict b{color:var(--bone)}

.warn{margin-top:11px;padding:9px 13px;background:rgba(231,194,125,.07);
  border-left:2px solid var(--gold);color:#d8c49c;font-size:12.5px}

/* ---------- layout ------------------------------------------------------ */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;
  margin-top:20px;align-items:start}
/* Above this width the detail panel takes two columns instead of one long
   scroll. A lobby is read in the fifteen seconds before the barriers drop;
   anything that needs scrolling in that window may as well not be there. */
@media(min-width:1500px){.grid{grid-template-columns:minmax(0,1fr) 716px}}
@media(max-width:1080px){.grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- team ------------------------------------------------------- */
.team{margin-bottom:20px}
.tbar{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.tname{font-family:var(--display);font-stretch:condensed;font-weight:700;
  font-size:19px;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.tside{font:600 9.5px/1 var(--display);letter-spacing:.2em;
  text-transform:uppercase;color:var(--slate);padding-top:2px}
.trule{flex:1;height:1px}
.tcount{font:600 9.5px/1 var(--display);letter-spacing:.16em;color:var(--ghost);
  text-transform:uppercase}
.atkc .tname{color:var(--atk)}
.atkc .trule{background:linear-gradient(90deg,var(--atk),transparent)}
.defc .tname{color:var(--def)}
.defc .trule{background:linear-gradient(90deg,var(--def),transparent)}

/* ---------- a player row ------------------------------------------------ */
.row{position:relative;display:grid;
  grid-template-columns:62px minmax(0,1fr) repeat(4,66px);
  align-items:center;gap:12px;height:66px;margin-bottom:5px;
  background:var(--steel);border:0;width:100%;text-align:left;
  padding:0 16px 0 0;cursor:pointer;color:inherit;font:inherit;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%);
  transition:background .14s ease,transform .14s ease}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--ghost);transition:width .14s ease,background .14s ease}
.atkc .row.known::before{background:var(--atk)}
.defc .row.known::before{background:var(--def)}
.row.known{background:var(--steel-2)}
.row:hover{background:#1b2734}
.row:hover::before{width:5px}
.row.sel{background:#1e2b3a}
.row.sel::before{width:7px}
.row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row.unknown{background:var(--sunk)}
.row.unknown .nm,.row.unknown .st b{color:var(--ghost)}
.row.unknown .rs{color:#33424f}

/* agent art bleeding out of the left, masked so it never fights the name */
.art{position:absolute;left:52px;top:0;height:100%;width:230px;
  object-fit:cover;object-position:center 12%;opacity:.44;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 26%,transparent 88%);
  mask-image:linear-gradient(90deg,#000 0,#000 26%,transparent 88%)}
.row.unknown .art{opacity:.13;filter:grayscale(1)}

.score{position:relative;font-family:var(--display);font-stretch:condensed;
  font-weight:700;font-size:31px;line-height:1;text-align:center;
  padding-left:14px}
.score .u{font-size:20px;color:var(--ghost)}
.atkc .row.known .score{color:var(--atk)}
.defc .row.known .score{color:var(--def)}

.who{position:relative;min-width:0}
.nm{font-weight:600;font-size:15.5px;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tag{font-family:var(--display);font-size:9.5px;font-weight:700;
  letter-spacing:.16em;color:var(--gold);margin-left:7px;vertical-align:1px}
.rs{color:var(--bone-dim);font-size:11.5px;line-height:1.35;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .ag{color:var(--slate)}
.alert{color:var(--gold);margin-left:6px}
/* A run this session. In words, so it does not lean on telling two hues apart,
   and outlined like the rank tag so it sits in every theme. */
.run{display:inline-block;margin-left:7px;padding:0 5px;
  font:700 9.5px/15px var(--display);letter-spacing:.06em;vertical-align:1px;
  border:1px solid currentColor;white-space:nowrap}
.run.lost{color:var(--val)} .run.won{color:var(--win)}

/* Rank sits with the agent name, not in its own column -- the row already
   carries four numbers and a fifth would not survive a phone. */
.rank{display:inline-block;padding:0 5px;margin-left:6px;font:700 10px/16px var(--display);
  letter-spacing:.06em;vertical-align:1px;border:1px solid currentColor}
.rank.unranked{color:var(--ghost);border-color:var(--line)}
.rank.iron{color:#8a8f94} .rank.bronze{color:#b1794a}
.rank.silver{color:#b9c3c9} .rank.gold{color:#e0bb52}
.rank.platinum{color:#4fc2d6} .rank.diamond{color:#c88ce0}
.rank.ascendant{color:#3ec98a} .rank.immortal{color:#e2456a}
.rank.radiant{color:#fff9c4;background:rgba(255,249,196,.10)}

/* A party marker. The letter is what ties members together at a glance --
   colour alone would fail for anyone who cannot separate the two teams' hues. */
.party{display:inline-flex;align-items:center;gap:3px;margin-left:7px;
  padding:0 5px;font:700 9.5px/16px var(--display);letter-spacing:.1em;
  background:var(--sunk);border:1px solid var(--line);color:var(--bone-dim);
  vertical-align:1px}
.party b{color:var(--gold);font-weight:700}
.partynote{color:var(--ghost);font-size:11px;margin:-2px 0 8px}

/* The result strip, and the table under it: what was predicted against what
   happened. Only a settled match has either. */
.result{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;
  margin-top:11px;padding:11px 15px;background:var(--steel-2);
  border-left:3px solid var(--slate);font-size:13px}
.result b{font-family:var(--display);font-stretch:condensed;font-size:19px;
  letter-spacing:.06em;text-transform:uppercase}
.result.won{border-left-color:var(--win)} .result.won b{color:var(--win)}
.result.lost{border-left-color:var(--val)} .result.lost b{color:var(--val)}
.result .tp{color:var(--bone-dim)}
.result.waiting{color:var(--bone-dim);border-left-color:var(--gold)}
.compare{margin-top:18px;background:var(--steel);padding:14px 16px 16px}
.compare h2{font:600 10.5px/1 var(--display);letter-spacing:.24em;
  text-transform:uppercase;color:var(--slate);margin:0 0 10px}
.compare table{width:100%;border-collapse:collapse;font-size:12.5px}
.compare th{font:600 9px/1 var(--display);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ghost);text-align:right;
  padding:0 0 7px;font-weight:600}
.compare th:first-child,.compare td:first-child{text-align:left}
.compare td{padding:5px 0;border-top:1px solid var(--line-soft);
  text-align:right;font-variant-numeric:tabular-nums}
.compare tr.you td{color:var(--gold)}
.compare tr.enemy td{color:var(--bone-dim)}
.compare .beat{color:var(--win)} .compare .under{color:var(--val)}
.ownpage{margin-bottom:10px}
.ownpage a{display:inline-block;background:var(--steel);border-left:3px solid var(--def);
  padding:9px 13px;color:var(--bone-dim);text-decoration:none;font-size:12.5px}
.ownpage a:hover{color:var(--bone);border-left-color:var(--gold)}
.recent{margin-top:18px;background:var(--steel);padding:14px 16px 16px}
.recent h2{font:600 10.5px/1 var(--display);letter-spacing:.24em;
  text-transform:uppercase;color:var(--slate);margin:0 0 10px}
a.recentrow{display:grid;grid-template-columns:110px 110px minmax(0,1fr) 130px 150px;
  gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line-soft);
  color:var(--bone-dim);text-decoration:none;font-size:13px}
a.recentrow:hover{color:var(--bone)}
a.recentrow:hover .ropen{color:var(--gold)}
.rmap{font-family:var(--display);font-stretch:condensed;font-weight:700;
  font-size:15px;color:var(--bone)}
.rwhen,.rcall{color:var(--ghost);font-size:12px}
.rres b.won{color:var(--win)} .rres b.lost{color:var(--val)}
.rres .wait{color:var(--ghost);font-style:italic}
.ropen{text-align:right;font:600 9.5px/1 var(--display);letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate)}
.recentnote{color:var(--ghost);font-size:11.5px;line-height:1.6;margin-top:10px}
.recentnote a{color:var(--bone-dim)}
@media(max-width:720px){
  a.recentrow{grid-template-columns:1fr 1fr;gap:2px 10px}
  .ropen{text-align:left}
}
.compare h3{font:600 9.5px/1 var(--display);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ghost);margin:16px 0 8px}
.compare h3:first-of-type{margin-top:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:10px}
.pblock{background:var(--sunk);border-left:3px solid var(--line-soft);
  padding:10px 12px 11px}
.pblock.you{border-left-color:var(--gold)}
.pblock.enemy{border-left-color:rgba(255,70,85,.45)}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pwho b{font-family:var(--display);font-stretch:condensed;font-weight:700;
  font-size:16px;letter-spacing:.02em}
.pwho .tag{font:600 8px/1 var(--display);letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold)}
.pwho .ag{display:block;font:400 11px/1.3 var(--body);color:var(--slate);
  margin-top:2px}
.pscore{text-align:right;white-space:nowrap}
.pscore b{font-family:var(--display);font-stretch:condensed;font-weight:700;
  font-size:26px;line-height:1}
.pscore span{display:block;font:600 8px/1 var(--display);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ghost);margin-top:3px}
.pline{font-size:12px;line-height:1.5;color:var(--bone-dim);margin:8px 0 0}
.pline b{color:var(--bone);font-weight:600}
.pwhy{font-size:11.5px;line-height:1.45;color:var(--slate);font-style:italic;
  margin-top:5px}
table.pstats{width:100%;border-collapse:collapse;font-size:12px;margin-top:9px}
table.pstats th{font:600 8px/1 var(--display);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ghost);text-align:right;
  padding:0 0 4px;font-weight:600}
table.pstats th .n{color:var(--line);letter-spacing:.04em}
table.pstats th:first-child,table.pstats td:first-child{text-align:left;
  color:var(--ghost)}
table.pstats td{padding:4px 0;border-top:1px solid var(--line-soft);
  text-align:right;font-variant-numeric:tabular-nums}
table.pstats td.mute,.pstats .mute{color:var(--ghost)}
.pstats .d.up{color:var(--win)} .pstats .d.dn{color:var(--val)}
@media(max-width:640px){.pgrid{grid-template-columns:1fr}}

.st{position:relative;text-align:center}
.st b{display:block;font-family:var(--display);font-stretch:condensed;
  font-weight:700;font-size:17px;line-height:1.05}
.st span{display:block;font:600 8.5px/1 var(--display);letter-spacing:.15em;
  text-transform:uppercase;color:var(--ghost);margin-top:3px}
.st.form b{color:var(--bone-dim)}

/* ---------- agent select: one card per teammate --------------------------
   About a minute to lock in, and the enemy is not visible yet, so the screen
   goes to the people on your side with every number showing at once -- all
   five of them, without scrolling. A card is two rows: who they are beside
   their last-20 numbers, then this map beside their last game. The numbers
   sit in the same place on every card, so a column reads straight down.

   The first version stacked everything and ran 152px a card, which put the
   fifth player below the fold of a maximised 1080p browser.
   tools/capture_dashboard.py now refuses to capture if all five stop fitting
   a 1920x800 or 2560x1300 window, or if anything on a card is clipped. */
.cards{display:grid;gap:6px}
/* The status line over the art, where the scoreboard's grey label vanished
   into the brightest part of the map. "Looking up" is what a reader is waiting
   on in agent select, so it takes the colour of the card still loading. */
.pregame .tcount{color:var(--bone-dim);text-shadow:0 1px 4px rgba(0,0,0,.9)}
.pregame .tcount .pend{color:var(--gold);font-weight:700}
/* The team's roles so far: who has locked, who is hovering, and what the
   undecided are likely to play. An empty role is what agent select is for. */
.comp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
  margin:0 0 7px}
.comp .slot{background:var(--sunk);padding:6px 10px 7px;min-width:0;
  border-top:2px solid var(--line-soft)}
.comp .slot b{display:block;font:700 9px/1 var(--display);letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);margin-bottom:4px}
.comp .slot span{display:block;font-size:12px;line-height:1.35;color:var(--bone-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp .slot .lik{color:var(--slate);font-style:italic}
.comp .slot.open{border-top-color:var(--gold)}
.comp .slot.open b,.comp .slot.open span{color:var(--gold)}
.rs .hov{color:var(--gold);font-size:10.5px;margin-left:4px}
.rs .lik{color:var(--slate);font-style:italic}
.picks .fill{display:inline-block;margin-left:6px;padding:0 5px;
  font:700 8.5px/15px var(--display);letter-spacing:.12em;text-transform:uppercase;
  color:var(--void);background:var(--gold)}
/* Your picks: the empty panel in agent select, put to the question it is
   there for. Agents played once or twice sit under a divider, readable --
   fewer games is a reason to read with care, not to hide them. */
.picks .ptitle{font:700 19px/1 var(--display);letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold);padding:18px 20px 0}
.picks .ptitle span{color:var(--slate);font-size:11px;letter-spacing:.18em}
.picks .pnote{color:var(--slate);font-size:12px;line-height:1.5;padding:8px 20px 4px}
.picks table.pstats{width:calc(100% - 40px);margin:6px 20px 0}
.picks td b{font-weight:600;color:var(--bone)}
.picks td .role{font-size:10.5px;color:var(--ghost);margin-left:6px}
.picks td.up{color:var(--win)}
.picks td.dn{color:var(--val)}
.picks td.mute{color:var(--bone-dim)}
.picks tr.split td{font:600 9px/1 var(--display);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ghost);padding:12px 0 4px;border-top:0}
.picks td .n{color:var(--ghost);font-size:11px}
.picks .hint{padding:14px 20px 18px;text-align:left;font-size:11.5px}
.pcard{position:relative;display:grid;
  grid-template-columns:62px minmax(0,1fr) auto;
  grid-template-areas:"score who stats" "score info info";
  align-items:center;gap:4px 16px;width:100%;text-align:left;border:0;
  padding:9px 18px 9px 0;background:var(--steel-2);color:inherit;font:inherit;
  cursor:pointer;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%);
  transition:background .14s ease}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--ghost);transition:width .14s ease}
.atkc .pcard.known::before{background:var(--atk)}
.defc .pcard.known::before{background:var(--def)}
.pcard:hover{background:#1b2734}
.pcard:hover::before{width:5px}
.pcard.sel{background:#1e2b3a}
.pcard.sel::before{width:7px}
.pcard:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pcard.unknown{background:var(--sunk)}
.pcard.unknown .art{opacity:.13;filter:grayscale(1)}
.pcard .score{grid-area:score;padding-left:12px}
.atkc .pcard.known .score{color:var(--atk)}
.defc .pcard.known .score{color:var(--def)}
.cwho{grid-area:who;position:relative;min-width:0}
/* Fixed columns, so K/D on one card sits directly above K/D on the next. */
.cstats{grid-area:stats;position:relative;display:grid;
  grid-template-columns:124px repeat(4,50px);gap:8px}
.cstats .st{text-align:left}
.cinfo{grid-area:info;position:relative;min-width:0;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px}
/* In place of the numbers, at the numbers' width, so the column holds. */
.cmsg{grid-area:stats;position:relative;width:356px;white-space:normal}
.cline{font-size:12.5px;line-height:1.5;color:var(--bone-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cline .ck{display:inline-block;min-width:70px;font:600 9px/1 var(--display);
  letter-spacing:.16em;text-transform:uppercase;color:var(--ghost)}
.cline .w{color:var(--win)}
.cline .l{color:var(--val)}
.cline .dim,.cline.dim{color:var(--ghost)}
.cline.looking{color:var(--gold);animation:looking 1.2s ease-in-out infinite}
@keyframes looking{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.cline.looking{animation:none}}
/* Below a desktop width the row cannot hold both columns: fold it, the same
   way the scoreboard row folds, rather than squeezing every name to nothing. */
@media(max-width:900px){
  .pcard{grid-template-columns:50px minmax(0,1fr);
    grid-template-areas:"score who" "stats stats" "info info";
    gap:7px 12px;padding-right:12px}
  .pcard .score{padding-left:6px}
  .cstats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;
    padding-left:12px}
  /* The scoreboard's phone rule pins every .st to its row's second line;
     on a card that collapsed five stats into one row with two 20px columns. */
  .cstats .st{grid-row:auto}
  .cinfo{grid-template-columns:minmax(0,1fr);gap:2px;padding-left:12px}
  .cmsg{width:auto;padding-left:12px}
  .cline{white-space:normal}
}

/* ---------- phones ------------------------------------------------------
   The row wants 62px + four 66px stat columns + gaps, about 400px before the
   name gets any space at all, so on a handset it has to fold. Score keeps the
   left edge and spans both lines; the name takes the top line; the four stats
   share the bottom one. Nothing is dropped -- a phone is where you check a
   lobby you are already in, so the numbers matter more than the spacing. */
@media(max-width:720px){
  .shell{padding:14px 12px 48px}
  .map{font-size:38px}
  .mapsub{font-size:9.5px;letter-spacing:.16em}
  .grid{gap:14px;margin-top:14px}
  .row{grid-template-columns:50px repeat(4,1fr);
    grid-template-rows:auto auto;height:auto;
    padding:9px 12px 9px 0;gap:6px 6px}
  .score{grid-column:1;grid-row:1 / span 2;font-size:26px;padding-left:10px}
  .who{grid-column:2 / -1;grid-row:1}
  .st{grid-row:2}
  .st b{font-size:14px}
  .st span{font-size:8px;letter-spacing:.1em}
  .art{left:44px;width:170px}
  .nm{font-size:14px}
  .rs{font-size:10.5px;white-space:normal}
  .oddsbar{height:30px}
  .oddsbar div{font-size:14px;padding:0 10px}
  .tname{font-size:16px}
  .tside{font-size:8.5px}
  .phero{height:170px}
  .pbody{padding:12px 13px 15px}
  .fx .f{grid-template-columns:64px minmax(0,1fr) 46px}
}

/* ---------- detail panel ------------------------------------------------ */
.panel{background:var(--steel);border:1px solid var(--line);position:sticky;
  top:18px;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
@media(max-width:1080px){.panel{position:static}}
.phero{position:relative;height:214px;overflow:hidden;background:var(--sunk)}
.phero img{position:absolute;left:50%;top:-6%;height:112%;
  transform:translateX(-50%);object-fit:contain}
.phero .veil{position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 30%,var(--steel) 96%)}
.phero .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.pid{position:absolute;left:0;right:0;bottom:0;padding:0 16px 12px}
.pid .pn{font-size:20px;font-weight:600;line-height:1.15;
  text-shadow:0 2px 10px rgba(0,0,0,.9)}
.pid .pa{font:600 10px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;
  color:var(--bone-dim);margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.pbody{padding:14px 16px 18px;max-height:calc(100vh - 272px);overflow-y:auto}
@media(max-width:1080px){.pbody{max-height:none}}
@media(min-width:1500px){
  .pbody{display:grid;grid-template-columns:1.02fr .98fr;gap:0 22px;
    align-items:start;max-height:calc(100vh - 250px)}
  .pcol>.sect:first-child{margin-top:2px;padding-top:0}
}
.pcol{min-width:0}
.pbody::-webkit-scrollbar{width:7px}
.pbody::-webkit-scrollbar-thumb{background:var(--line)}

.bigscore{display:flex;align-items:flex-end;gap:11px;margin-bottom:4px}
.bigscore b{font-family:var(--display);font-stretch:condensed;font-weight:700;
  font-size:48px;line-height:.82}
.bigscore span{font:600 9.5px/1 var(--display);letter-spacing:.18em;
  text-transform:uppercase;color:var(--ghost);padding-bottom:5px}
.pwhy{color:var(--bone-dim);font-size:12.5px;margin-bottom:2px}

.sect{display:flex;align-items:center;gap:9px;margin:16px 0 8px;
  font:600 9.5px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ghost)}
.sect::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.cmp{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:3px 0;border-bottom:1px solid var(--line-soft)}
.cmp:last-child{border-bottom:0}
.cmp .k{color:var(--slate)}
.cmp .v{text-align:right;white-space:nowrap;font-weight:600}
.cmp .v.up{color:var(--win)} .cmp .v.dn{color:var(--val)}
.cmp .v.mute{color:var(--ghost);font-weight:400}

table.tw{width:100%;font-size:12.5px;border-collapse:collapse}
table.tw th{font:600 8.5px/1 var(--display);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ghost);padding:0 0 6px;text-align:right}
table.tw th.l{text-align:left}
table.tw td{padding:3px 0;color:var(--slate)}
table.tw td.n{text-align:right;color:var(--bone);font-weight:600}
table.tw td.n.f{color:var(--bone-dim)}
table.tw tr+tr td{border-top:1px solid var(--line-soft)}

.chips span{display:inline-block;background:var(--sunk);border:1px solid var(--line-soft);
  padding:2px 8px;margin:3px 4px 0 0;font-size:11px;color:var(--bone-dim)}
.formrow{display:flex;justify-content:space-between;gap:9px;font-size:11.5px;
  padding:3px 0;color:var(--bone-dim);border-bottom:1px solid var(--line-soft)}
.formrow:last-child{border-bottom:0}
.formrow .w{color:var(--win);font-weight:700} .formrow .l{color:var(--val);font-weight:700}
.formrow .when{color:var(--ghost)}
.flag{margin-top:11px;padding:9px 12px;background:rgba(255,70,85,.08);
  border-left:2px solid var(--val);color:#ffb0b7;font-size:11.5px}
.stale{color:var(--gold)}
.hint{padding:56px 20px;text-align:center;color:var(--ghost);font-size:12.5px;
  line-height:1.7}
.hint .kbd{font-family:var(--display);border:1px solid var(--line);
  padding:1px 6px;color:var(--slate)}

/* ---------- factors ----------------------------------------------------- */
.fx{background:var(--steel);border:1px solid var(--line);padding:13px 16px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.fx h2{font:600 9.5px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ghost);margin:0 0 9px}
.fx .f{display:grid;grid-template-columns:76px minmax(0,1fr) 54px;gap:10px;
  align-items:center;padding:3px 0;font-size:12.5px}
.fx .dir{font:600 8.5px/1 var(--display);letter-spacing:.13em;text-transform:uppercase}
.fx .track{height:3px;background:var(--sunk);position:relative}
.fx .track i{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%)}
.fx .mag{text-align:right;color:var(--slate)}
.fx .toA{color:var(--atk)} .fx .toB{color:var(--def)}

.idle{padding:90px 20px;text-align:center;color:var(--slate)}
.foot{margin-top:22px;padding-top:13px;border-top:1px solid var(--line);
  color:var(--ghost);font-size:11.5px;line-height:1.7;max-width:96ch}
</style>
</head>

  const picked = mine.reduce((a, b) => a.predicted_rank < b.predicted_rank ? a : b);
  const best = players.filter(p => p.team === s.own_team)
    .reduce((a, b) => a.actual_rank < b.actual_rank ? a : b);
  const within = mine.filter(p => Math.abs(p.predicted_rank - p.actual_rank) <= 1);
  const won = view.side === "Blue";

  payload.review = {
    settled: true, own_team: s.own_team, correct: won ? 1 : 0,
    predicted: {own_probability: s.prediction.own_probability},
    actual: {winner: s.own_team, own_won: won ? 1 : 0,
             score: won ? "13-9" : "9-13"},
    top_pick: {hit: picked.puuid === best.puuid ? 1 : 0,
               picked: picked.name, actually_best: best.name},
    summary: {winner_called: won ? 1 : 0,
              top_pick_hit: picked.puuid === best.puuid ? 1 : 0,
              rated: mine.length, within_one: within.length, order: 0.46},
    players: players,
  };
  return payload;
}

function send(){
  if (!socket || !socket.onmessage) return;
  const msg = view.status === "lobby" ? {status: "lobby"}
            : view.status === "finished" ? finished() : build();
  socket.onmessage({data: JSON.stringify(msg)});
}

/* Stands in for the connection to `python -m valwr.dash`. The page assigns
   its handlers after constructing the socket, so delivery waits a tick. */
window.WebSocket = class {
  constructor(){ socket = this; setTimeout(() => { if (this.onopen) this.onopen(); send(); }, 50); }
  close(){}
};

window.__demo = {
  set(key, value){ if (key in view){ view[key] = value; sync(); send(); } },
  view: () => ({...view}),
};

const bar = document.createElement("div");
bar.className = "demo-bar";
bar.setAttribute("role", "region");
bar.setAttribute("aria-label", "Demo controls");
const option = (v, text) => `<option value="${v}">${text}</option>`;
bar.innerHTML = `<b>Interactive demo</b>
  <label>Map <select data-k="map">${MAPS.map(m => option(m, m)).join("")}</select></label>
  <label>You are <select data-k="side">${option("Blue", "Blue · defending")}${option("Red", "Red · attacking")}</select></label>
  <label>Phase <select data-k="phase">${option("coregame", "In game")}${option("pregame", "Agent select")}</select></label>
  <label>Players known <select data-k="known">${option("full", "8 of 10")}${option("thin", "4 of 10")}</select></label>
  <label>Status <select data-k="status">${option("match", "In a match")}${option("finished", "After the game")}${option("lobby", "In the menus")}</select></label>
  <span class="fine">Invented players. Click any row for the full card; Esc closes it.
    The real dashboard runs on your own PC while you play &mdash;
    <a href="https://github.com/fahranalam04-cmd/valorant-winrate-predictor">source and setup</a>.
    Agent and map art &copy; Riot Games. Not affiliated with or endorsed by Riot Games.</span>`;

function sync(){
  for (const el of bar.querySelectorAll("select")) el.value = view[el.dataset.k];
}
for (const el of bar.querySelectorAll("select"))
  el.addEventListener("change", () => window.__demo.set(el.dataset.k, el.value));
sync();

const room = document.createElement("div");
room.className = "demo-room";
document.body.appendChild(room);
document.body.appendChild(bar);
if (qs.has("clean")) document.body.classList.add("demo-clean");
})();
</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Numbers are escaped too. They are computed from stored API responses, and
   SQLite keeps whatever it was given -- a "kills" that arrived as markup is
   still markup. Number() makes a non-number read NaN instead of rendering. */
const n1 = v => v == null ? "—" : Number(v).toFixed(1);
const n2 = v => v == null ? "—" : Number(v).toFixed(2);
const pc = v => v == null ? "—" : (Number(v) * 100).toFixed(1) + "%";
const i0 = v => v == null ? "—" : esc(v);
const n0 = v => v == null ? "—" : Math.round(Number(v));
const pc0 = v => v == null ? "—" : Math.round(Number(v) * 100) + "%";

let STATE = null, selected = null, top1 = null, tries = 0;
/* The result belongs to a match, not to a message: clicking a player or
   pressing Esc re-renders from the stored state, and that used to wipe the
   scoreboard comparison off a finished match. */
let REVIEW = null, REVIEW_ID = null;

/* The map's own key art is the background, so it changes with the match.
   `--mapart` is set from the state rather than from a stylesheet because the
   map is only known at runtime; the file is named by the lowercased map name,
   which is exactly what the live state carries. A map with no art on disk
   resolves to `none` and the gradient scrim stands on its own. */
function setMapArt(){
  const name = STATE && STATE.map
    ? STATE.map.toLowerCase().replace(/[^a-z0-9]/g, "") : "";
  document.body.style.setProperty("--mapart",
    name ? `url("${base()}maps/${name}-splash.jpg")` : "none");
}

/* Where the artwork sits relative to whatever page is open.

   Rooting these at "/agents/" would break the interactive demo, which lives
   under /valorant-winrate-predictor/ on GitHub Pages. But plain relative paths
   broke something worse: a match's own page is served at /m/<id>, one level
   deeper, so every agent portrait and the map background resolved to
   /m/agents/... and 404'd. The saved tab -- the one kept specifically to read
   after the game -- was the only page in the app with no artwork at all. */
function base(){
  const pinned = location.pathname.match(/^(.*\/)m\/[^/]*$/);
  return pinned ? pinned[1] : location.pathname.replace(/[^/]*$/, "");
}
const artURL = (p, k) =>
  p.agent_id ? `${base()}agents/${encodeURIComponent(p.agent_id)}-${k}.png` : "";
/* The client reports a mode as "BombGameMode.BombGameMode_C", which is an
   identifier, not something to print at a reader. */
function modeLabel(m){
  if (!m) return "—";
  const tail = String(m).split("/").pop().split(".").pop()
    .replace(/_C$/, "").replace(/GameMode$/i, "");
  const known = {bomb: "Standard", deathmatch: "Deathmatch",
                 swiftplay: "Swiftplay", spikerush: "Spike rush",
                 escalation: "Escalation", teamdeathmatch: "Team deathmatch",
                 hurm: "Team deathmatch", ggteam: "Escalation",
                 onefa: "Replication", quickbomb: "Spike rush"};
  return known[tail.toLowerCase()] || (tail || String(m));
}
const isAtk = t => t === "Red";

/* A lean, in words the model can stand behind. It is calibrated but modest:
   the extreme tenths of its test-set calls averaged 40% and 60%, and it picked
   the winner 54% of the time, so nothing here says "favoured" -- trackHTML
   says what a number like this has meant instead. */
function verdict(p){
  const e = Math.abs(p - .5);
  if (e < .02) return "Coin flip";
  return (e < .05 ? "Slight lean " : "Leans ") + (p > .5 ? "your way" : "their way");
}

/* What the same call meant in testing (model/calibration.py): how often the
   side it leaned to won, from the reliability bin nearest this prediction,
   and how often it picks the winner with this many players known. Nothing
   when the record is not the loaded model's. */
let RECORD = null;
function trackHTML(s){
  const rec = RECORD, pr = s.prediction;
  if (!rec || !pr || !(rec.bins || []).length) return "";
  const p = pr.win_probability;                       // Blue's
  const [m, o, n] = rec.bins.reduce((a, b) =>
    Math.abs(b[0] - p) < Math.abs(a[0] - p) ? b : a);
  const won = m >= .5 ? o : 1 - o;
  const pts = Math.round(1.96 * Math.sqrt(won * (1 - won) / n) * 100);
  const tested = rec.bins.map(b => b[0]);
  const beyond = p > Math.max(...tested) + .05 || p < Math.min(...tested) - .05;
  let out = beyond
    ? `A stronger call than almost any it made in testing. Its strongest tenth
       there were won by the side it leaned to ${pc0(won)} of the time`
    : `When it rated a match like this, the side it leaned to won ${pc0(won)}
       of the time`;
  out += ` (±${pts}, ${i0(n.toLocaleString("en-US"))} test matches).`;
  const range = st => String(st.known).split("-").map(Number);
  const k = s.coverage, of = s.players.length;
  const st = (rec.strata || []).find(x => {
    const [a, b] = range(x); return k >= a && k <= b; });
  const fewest = Math.min(...(rec.strata || []).map(x => range(x)[0])
    .filter(Number.isFinite));
  if (st) out += ` With ${i0(k)} of ${i0(of)} players known it picks the winner
    ${pc0(st.accuracy)} of the time.`;
  else if (Number.isFinite(fewest) && k < fewest)
    out += ` With only ${i0(k)} of ${i0(of)} known, this is
    outside what it was tested on (${i0(fewest)} or more).`;
  return `<div class="callrec">${out}</div>`;
}

/* ---------------- roster ---------------- */
/* Which party a player is in, as a letter. Rebuilt on every render from the
   state rather than stored, so it cannot go stale against the roster. */
let PARTY_OF = {};
function indexParties(s){
  PARTY_OF = {};
  const letters = "ABCDEFGH";
  (s.parties || []).forEach((g, i) => {
    for (const m of g.members)
      PARTY_OF[m] = {letter: letters[i % letters.length], label: g.label,
                     size: g.size, source: g.source};
  });
}
function partyTag(puuid){
  const g = PARTY_OF[puuid];
  if (!g) return "";
  const how = g.source === "exact" ? "queued together"
            : "have queued together before";
  return `<span class="party" title="${esc(g.label)} — ${how}">`
       + `<b>${g.letter}</b>${esc(g.label)}</span>`;
}
function rankTag(r){
  if (!r) return "";
  const cls = r.division.toLowerCase().replace(/[^a-z]/g, "") || "unranked";
  return `<span class="rank ${cls}" title="${esc(r.name)}">${esc(r.short)}</span>`;
}

/* Three or more the same this session, your team only (live/streak.py). The
   score and the prediction never read it. Beside the name on a card; on a
   scoreboard row it follows the agent instead, because the two-column board
   has no room left on the name line for the longest Riot IDs, and a name cut
   short is worse than a reason that trails off. */
function runTag(p){
  const r = p.streak;
  if (!r || (r.result !== "won" && r.result !== "lost")) return "";
  return `<span class="run ${r.result}">${r.result} ${i0(r.count)} in a row</span>`;
}

function rowHTML(p){
  const c = p.career, r = p.recent, known = p.score !== null;
  const stat = (label, val, cls) =>
    `<div class="st ${cls || ""}"><b class="num">${val}</b><span>${label}</span></div>`;
  return `<button class="row ${known ? "known" : "unknown"}${
      selected === p.puuid ? " sel" : ""}" data-puuid="${esc(p.puuid)}"
      aria-pressed="${selected === p.puuid}">
    ${p.agent_id ? `<img class="art" src="${artURL(p, "row")}" alt=""
        decoding="async" onerror="this.remove()">` : ""}
    <div class="score">${known ? esc(p.score) : '<span class="u">—</span>'}</div>
    <div class="who">
      <div class="nm">${esc(p.name)}${p.is_you ? '<span class="tag">YOU</span>' : ""}${
        partyTag(p.puuid)}${
        p.flag ? '<span class="alert" title="irregularity flagged">◆</span>' : ""}</div>
      <div class="rs"><span class="ag">${esc(p.agent || "selecting")}</span>${runTag(p)}
        ${rankTag(p.rank)}
        &nbsp;·&nbsp;${esc(p.reason)}</div>
    </div>
    ${stat("adr", c ? n1(c.adr) : "—")}
    ${stat("k/d", c ? n2(c.kd) : "—")}
    ${stat("last 20", r ? n2(r.kd) : "—", "form")}
    ${stat("hs%", c ? pc(c.headshot_rate) : "—")}
  </button>`;
}

function teamHTML(s, team){
  const players = s.players.filter(p => p.team === team);
  if (!players.length) return "";
  const atk = isAtk(team);
  const side = s.standard_mode ? (atk ? "attacking · first half"
                                      : "defending · first half") : "";
  const known = players.filter(p => p.score !== null).length;
  return `<section class="team ${atk ? "atkc" : "defc"}">
    <div class="tbar">
      <span class="tname">${esc(team)}</span>
      <span class="tside">${esc(side)}</span>
      <span class="trule"></span>
      <span class="tcount">${s.own_team === team ? "your side · " : ""}${
        known}/${players.length} known</span>
    </div>
    ${players.map(rowHTML).join("")}
  </section>`;
}

/* ---------------- agent select ----------------
   Every number on the card at once, nothing behind a click: there is about a
   minute to lock in. The click still opens the full breakdown in the panel.
   Figures are the last 20 competitive games (fewer when fewer are stored,
   and the label says how many), per game where a per-game number reads
   better -- 17.2/13.1/4.8 rather than 344/262/96. */
function cardHTML(p, pending, mapName){
  const d = p.detail, r = p.recent, known = p.score !== null;
  const stat = (label, val) =>
    `<div class="st"><b class="num">${val}</b><span>${label}</span></div>`;
  const per = n => r && r.games ? (n / r.games).toFixed(1) : "—";
  let body;
  if (!d){
    /* Two different things look identical here: someone still being looked
       up, and someone with nothing to find. Saying "no history" about a
       player whose lookup has not landed yet would be wrong for a few seconds
       in almost every lobby. */
    body = pending
      ? `<div class="cline looking cmsg">Looking up their last 20 competitive
           games</div>`
      : `<div class="cline dim cmsg">No competitive history found: a new
           account, or one that has not played ranked.</div>`;
  } else {
    const m = d.map || {}, f = (d.form || [])[0];
    const agents = (m.agents || []).slice(0, 3)
      .map(a => `${esc(a.agent)} ×${esc(a.games)}`).join(" · ");
    const mapLine = m.games
      ? `${agents}<span class="dim"> &nbsp;${esc(m.games)} game${
          m.games === 1 ? "" : "s"} · ${esc(m.wins)}–${esc(m.losses)}</span>`
      : `<span class="dim">never played it in competitive</span>`;
    const result = !f || f.won === null ? "" :
      `<b class="${f.won ? "w" : "l"}">${f.won ? "W" : "L"}${
        f.rounds_won != null ? ` ${esc(f.rounds_won)}–${esc(f.rounds_lost)}` : ""}</b> `;
    const lastLine = f
      ? `${result}${esc(f.map || "?")} · ${esc(f.agent || "?")} · ${
          i0(f.kills)}/${i0(f.deaths)}/${i0(f.assists)} · HS ${
          pc0(f.headshot_rate)}<span class="dim"> · ${esc(f.ago)}</span>`
      : `<span class="dim">none stored</span>`;
    body = `<div class="cstats">
        ${stat(`k/d/a · last ${r ? esc(r.games) : 0}`,
               r ? `${per(r.kills)}/${per(r.deaths)}/${per(r.assists)}` : "—")}
        ${stat("k/d", r ? n2(r.kd) : "—")}
        ${stat("hs%", r ? pc0(r.headshot_rate) : "—")}
        ${stat("adr", r ? n0(r.adr) : "—")}
        ${stat("win", r ? pc0(r.win_rate) : "—")}
      </div>
      <div class="cinfo">
        <div class="cline"><span class="ck">On ${esc(m.name || mapName || "this map")
          }</span>${mapLine}</div>
        <div class="cline"><span class="ck">Last comp</span>${lastLine}</div>
      </div>`;
  }
  return `<button class="pcard ${known ? "known" : "unknown"}${
      selected === p.puuid ? " sel" : ""}" data-puuid="${esc(p.puuid)}"
      aria-pressed="${selected === p.puuid}">
    ${p.agent_id ? `<img class="art" src="${artURL(p, "row")}" alt=""
        decoding="async" onerror="this.remove()">` : ""}
    <div class="score">${known ? esc(p.score) : '<span class="u">—</span>'}</div>
    <div class="cwho">
      <div class="nm">${esc(p.name)}${p.is_you ? '<span class="tag">YOU</span>' : ""}${
        partyTag(p.puuid)}${
        p.flag ? '<span class="alert" title="irregularity flagged">◆</span>' : ""}${
        runTag(p)}</div>
      <div class="rs">${p.agent ? `<span class="ag">${esc(p.agent)}</span>${
          p.selection === "selected" ? '<span class="hov">hovering</span>' : ""}`
        : p.likely && !p.is_you ? `<span class="ag lik">likely ${esc(p.likely.role)} ${
          i0(p.likely.games)}/${i0(p.likely.of)}</span>`
        : '<span class="ag">selecting</span>'}
        ${rankTag(p.rank)}${known ? `&nbsp;·&nbsp;${esc(p.reason)}` : ""}</div>
    </div>
    ${body}
  </button>`;
}

function pregameHTML(s){
  const team = s.own_team;
  const players = s.players.filter(p => p.team === team);
  const pending = new Set((s.lookup && s.lookup.pending) || []);
  const known = players.filter(p => p.score !== null).length;
  const left = pending.size ? `<b class="pend">looking up ${pending.size}</b>`
    : esc(s.lookup && s.lookup.remaining ? "filling in last 20s" : "all looked up");
  const side = s.standard_mode ? (isAtk(team) ? "attacking · first half"
                                             : "defending · first half") : "";
  return `<section class="team pregame ${isAtk(team) ? "atkc" : "defc"}">
    <div class="tbar">
      <span class="tname">Your team</span>
      <span class="tside">${esc(side)}</span>
      <span class="trule"></span>
      <span class="tcount">${known}/${players.length} known · ${left}</span>
    </div>
    ${compHTML(s)}
    <div class="cards">${players.map(p =>
      cardHTML(p, pending.has(p.puuid), s.map)).join("")}</div>
  </section>`;
}

/* ---------------- panel ---------------- */
/* `recent` is null when this renders a single tally -- the per-map block --
   and a Career when it compares record against form. The note below only
   makes sense in the second case: with no window there is nothing for the
   games to fall inside, and it printed "the last 0" under every map. */
function twoUp(career, recent, win){
  if (!career || !career.games)
    return `<div class="cmp"><span class="k">no games on record</span></div>`;
  const same = !recent || recent.games >= career.games;
  const line = (k, a, b) => `<tr><td>${k}</td><td class="n">${a}</td>${
    same ? "" : `<td class="n f">${b}</td>`}</tr>`;
  return `<table class="tw">
    <thead><tr><th class="l"></th><th>career</th>${
      same ? "" : `<th>last ${esc(recent.games)}</th>`}</tr></thead><tbody>
    ${line("Games", i0(career.games), i0(recent && recent.games))}
    ${line("Damage / round", n1(career.adr), n1(recent && recent.adr))}
    ${line("K/D", n2(career.kd), n2(recent && recent.kd))}
    ${line("Headshot %", pc(career.headshot_rate), pc(recent && recent.headshot_rate))}
    ${line("Win rate", pc(career.win_rate), pc(recent && recent.win_rate))}
    ${line("K / D / A", `${i0(career.kills)}/${i0(career.deaths)}/${i0(career.assists)}`,
        recent ? `${i0(recent.kills)}/${i0(recent.deaths)}/${i0(recent.assists)}` : "—")}
    </tbody></table>${same && recent ? `<div class="cmp"
      style="border:0;padding-top:7px"><span class="k">All ${esc(career.games)}
      stored matches fall inside the last ${esc(win)}, so form and career are the
      same games.</span></div>` : ""}`;
}

/* Who covers which role on your team so far. Locked and hovered agents say;
   for anyone undecided, the role their last twenty games point to. You are
   left out while you are still choosing -- that is the decision this is for. */
const ROLES = ["Duelist", "Controller", "Initiator", "Sentinel"];
const short = name => String(name || "").split("#")[0];

function teamRoles(s){
  const by = Object.fromEntries(ROLES.map(r => [r, []]));
  for (const p of s.players.filter(x => x.team === s.own_team)){
    if (p.agent && p.role && by[p.role])
      by[p.role].push({p, how: p.selection === "selected" ? "hovering"
                               : p.selection === "locked" ? "locked" : "picked"});
    else if (!p.is_you && p.likely && by[p.likely.role])
      by[p.likely.role].push({p, how: "likely"});
  }
  return {by, open: ROLES.filter(r => !by[r].length)};
}

function compHTML(s){
  const {by} = teamRoles(s);
  const who = e => e.how === "likely"
    ? `<span class="lik">${esc(short(e.p.name))} likely, ${i0(e.p.likely.games)}/${
        i0(e.p.likely.of)}</span>`
    : `<span>${esc(short(e.p.name))} · ${esc(e.p.agent)}${
        e.how === "hovering" ? " (hovering)" : ""}</span>`;
  return `<div class="comp">${ROLES.map(r => by[r].length
    ? `<div class="slot"><b>${r}</b>${by[r].map(who).join("")}</div>`
    : `<div class="slot open"><b>${r}</b><span>open</span></div>`).join("")}</div>`;
}

/* In agent select the panel answers what to pick: the agents you play best,
   against your own average. A teammate's card replaces it on click, and ESC
   brings it back. */
const PICK_TONE = {
  "well above your usual": ["up", "▲▲ well above"],
  "above your usual": ["up", "▲ above"],
  "your usual": ["mute", "≈ your usual"],
  "below your usual": ["dn", "▼ below"],
  "well below your usual": ["dn", "▼▼ well below"],
};

function picksHTML(s){
  const yp = s.your_picks, few = yp.few || [];
  const open = new Set(teamRoles(s).open);
  const row = (a, played) => {
    const [tone, text] = PICK_TONE[a.label] || ["mute", a.label];
    const h = a.here || {};
    return `<tr class="${played ? "few" : ""}">
      <td><b>${esc(a.agent)}</b><span class="role">${esc(a.role || "")}</span>${
        open.has(a.role) ? '<span class="fill">open role</span>' : ""}</td>
      <td class="${tone}">${esc(text)}${played ? ` <span class="n">in ${
        i0(a.games)} game${a.games === 1 ? "" : "s"}</span>` : ""}</td>
      <td>${i0(a.games)}</td>
      <td>${i0(a.wins)}–${i0(a.losses)}</td>
      <td>${h.games ? `${i0(h.wins)}–${i0(h.losses)}` : "—"}</td></tr>`;
  };
  const rows = yp.agents.map(a => row(a, false)).join("") + (few.length
    ? `<tr class="split"><td colspan="5">Played once or twice</td></tr>`
      + few.map(a => row(a, true)).join("") : "");
  return `<aside class="panel picks">
    <div class="ptitle">Your picks <span>· ${esc(yp.map || s.map || "")}</span></div>
    <div class="pnote">How well you play each agent, against your own average
      over ${i0(yp.games)} competitive games. Agents with three or more are
      ranked, pulled toward your average when games are few; under them, the
      ones you have played once or twice, with what those games showed. The
      map record is context: one to three games an agent is all anyone has.</div>
    <table class="pstats"><thead><tr><th>agent</th><th>you on it</th>
      <th>games</th><th>w–l</th><th>on ${esc(yp.map || s.map || "map")}</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="hint">Click a teammate for their full card;
      <span class="kbd">ESC</span> comes back here.</div>
  </aside>`;
}

function panelHTML(s){
  const p = s.players.find(x => x.puuid === selected);
  // Agents played once or twice count too: a newer account has only those.
  const yp = s.your_picks;
  if (!p && s.phase === "pregame" && yp
      && ((yp.agents || []).length || (yp.few || []).length))
    return picksHTML(s);
  if (!p) return `<aside class="panel"><div class="hint">
      Select any player for their agent, career record,<br>
      recent form and how they play ${esc(s.map || "this map")}.
      <div style="margin-top:14px"><span class="kbd">ESC</span> closes</div>
    </div></aside>`;

  const accent = isAtk(p.team) ? "var(--atk)" : "var(--def)";
  const d = p.detail;
  let body;

  if (!d){
    body = `<div class="pcol" style="grid-column:1/-1"><div class="hint"
      style="padding:30px 0">
      <b style="color:var(--bone-dim)">No match history.</b><br>
      They are in the lobby and counted in the prediction,<br>
      but nothing is known about how they play.</div></div>`;
  } else {
    const m = d.map;
    const comps = d.components.map(c => {
      const gated = c.key === "map_edge" && !m.counts_toward_score;
      const cls = gated ? "mute" : c.contribution > 0 ? "up"
                : c.contribution < 0 ? "dn" : "mute";
      return `<div class="cmp"><span class="k">${esc(c.label)}</span>
        <span class="v ${cls}">${esc(c.note)}</span></div>`;
    }).join("");

    const mapBlock = m.games
      ? twoUp(m, null, 0) + (m.counts_toward_score ? ""
          : `<div class="cmp" style="border:0"><span class="k">Under ${esc(m.gate)}
             games here, so the map does not move the score.</span></div>`)
        + (m.agents && m.agents.length ? `<div class="chips">${
            m.agents.slice(0, 5).map(a =>
              `<span>${esc(a.agent)} ×${esc(a.games)}</span>`).join("")}</div>` : "")
      : `<div class="cmp"><span class="k">Never played this map.</span></div>`;

    const form = (d.form || []).map(f => `<div class="formrow">
        <span>${esc(f.map || "?")} <span class="when">·</span> ${esc(f.agent || "?")}</span>
        <span><span class="${f.won === null ? "" : f.won ? "w" : "l"}">${
          f.won === null ? "–" : f.won ? "W" : "L"}</span>
          <span class="num">&nbsp;${n1(f.adr)}</span>
          <span class="num">&nbsp;${i0(f.kills)}/${i0(f.deaths)}</span>
          <span class="when">&nbsp;${esc(f.ago)}</span></span></div>`).join("");

    // Split by kind, not by length: everything explaining the number on the
    // left, everything describing where and when on the right.
    body = `
      <div class="pcol">
        <div class="bigscore"><b style="color:${accent}">${esc(p.score)}</b>
          <span>of 100</span></div>
        <div class="pwhy">${esc(p.reason)}</div>
        ${p.flag ? `<div class="flag">${esc(p.flag.note)}</div>` : ""}
        <div class="sect">what makes the score</div>${comps}
        <div class="sect">record &amp; form</div>
        ${twoUp(d.career, d.recent, d.recent_window || 20)}
      </div>
      <div class="pcol">
        <div class="sect">on ${esc(m.name)}</div>${mapBlock}
        ${form ? `<div class="sect">last matches</div>${form}` : ""}
        <div class="sect">data</div>
        <div class="cmp"><span class="k">Freshness</span>
          <span class="v ${d.freshness.stale ? "stale" : ""}">${
            esc(d.freshness.label)}</span></div>
        <div class="cmp"><span class="k">Matches on record</span>
          <span class="v">${i0(d.freshness.games_known)}</span></div>
        <div class="cmp"><span class="k">Queues counted</span>
          <span class="v">competitive only</span></div>
      </div>`;
  }

  return `<aside class="panel">
    <div class="phero">
      <div class="stripe" style="background:${accent}"></div>
      ${p.agent_id ? `<img src="${artURL(p, "portrait")}" alt=""
          decoding="async" onerror="this.remove()">` : ""}
      <div class="veil"></div>
      <div class="pid"><div class="pn">${esc(p.name)}${partyTag(p.puuid)}</div>
        <div class="pa">${esc(p.agent || "selecting")}${
          p.role ? " · " + esc(p.role) : ""} · ${esc(p.team)}${
          p.rank ? " · " + esc(p.rank.name) : ""}</div></div>
    </div>
    <div class="pbody" id="pbody">${body}</div>
  </aside>`;
}

/* ---------------- the result, once the match is over ---------------- */
function resultHTML(rv){
  if (!rv) return "";
  if (!rv.settled)
    return `<div class="result waiting">Prediction recorded. The result is
      fetched automatically a few minutes after the match ends.</div>`;
  const a = rv.actual, won = a.own_won === 1, right = rv.correct === 1;
  const pick = rv.top_pick || {};
  return `<div class="result ${won ? "won" : "lost"}">
    <b>${won ? "Won" : "Lost"} ${esc(a.score || "")}</b>
    <span>predicted ${(rv.predicted.own_probability * 100).toFixed(0)}% for
      your side — <b style="font-size:13px;letter-spacing:0">${
        right ? "called it" : "wrong"}</b></span>
    ${pick.hit === null || pick.hit === undefined ? "" : `<span class="tp">top
      pick ${pick.hit ? "correct" : "missed"}: ${esc(pick.picked || "—")}${
        pick.hit ? "" : ` — best was ${esc(pick.actually_best || "—")}`}</span>`}
  </div>`;
}

/* Predicted against actual, one player at a time.

   The whole reason for keeping a tab per match is to read it afterwards, so
   this is deliberately not a summary: every player gets their own block with
   what the page knew beforehand -- their career line, their recent form, the
   reason the score gave -- set against what they actually did, and the
   difference between the two spelled out rather than left to be worked out.

   The comparison that matters per player is against *themselves*, not against
   the lobby. The 0-100 already ranks them against each other; "did they play
   like they usually play" is the question the scoreboard can answer and the
   ranking cannot. */
function deltaCell(d, fmt, good){
  if (d == null) return `<span class="d mute">—</span>`;
  const cls = good === 0 ? "" : (d > 0) === (good > 0) ? "up" : "dn";
  return `<span class="d ${cls}">${d > 0 ? "+" : "−"}${fmt(d)}</span>`;
}

function playerBlock(p, rv, rated, placed){
  const seen = p.career_games || 0;
  const mine = p.team === rv.own_team;
  const move = (p.predicted_rank && p.actual_rank)
    ? p.predicted_rank - p.actual_rank : null;
  const places = n => `${n} place${n === 1 ? "" : "s"}`;
  const by = rv.best_by === "performance score" ? "Performance Score" : "match impact";
  const placing = move === 0 ? `exactly where the score put them`
    : `${places(Math.abs(move))} ${move > 0 ? "better" : "worse"} than the
       score expected`;

  // Their own baseline, which is what the match is read against. Without any
  // history the block still renders -- the point is that the page said "--"
  // beforehand and should keep saying it.
  const rows = [
    p.career_adr != null || p.adr != null
      ? ["Damage / round", n1(p.career_adr), n1(p.adr),
         deltaCell(p.adr_delta, v => Math.abs(v).toFixed(0), 1)]
      // Recorded before patch 13.06, when the card held combat score and no
      // damage figure. Shown as it was rather than left blank.
      : ["Combat score", n1(p.career_acs), n1(p.acs),
         deltaCell(p.acs_delta, v => Math.abs(v).toFixed(0), 1)],
    ...(p.performance_score != null
      ? [["Performance Score", "—", i0(p.performance_score), "—"]] : []),
    ["K / D", p.career_kd == null ? "—" : Number(p.career_kd).toFixed(2),
     p.kd == null ? "—" : Number(p.kd).toFixed(2),
     deltaCell(p.kd_delta, v => Math.abs(v).toFixed(2), 1)],
    ["Headshots", pc(p.career_hs), pc(p.headshot_rate),
     deltaCell(p.hs_delta == null ? null : p.hs_delta * 100,
               v => Math.abs(v).toFixed(1) + "pt", 1)],
  ];

  return `<div class="pblock ${p.is_you ? "you" : mine ? "" : "enemy"}">
    <div class="phead">
      <div class="pwho"><b>${esc(p.name)}</b>${p.is_you ? ` <span class="tag">you
        </span>` : ""}<span class="ag">${esc(p.agent || "")}${
        p.rank ? " · " + esc(p.rank.name || p.rank) : ""}</span></div>
      <div class="pscore">${p.predicted_score === null
        || p.predicted_score === undefined ? `<span class="mute">no score</span>`
        : `<b>${i0(p.predicted_score)}</b><span>out of 100</span>`}</div>
    </div>
    <div class="pline">${p.predicted_rank
      ? `Ranked <b>#${i0(p.predicted_rank)}</b> of the ${i0(rated)} players the
         page could score, and finished <b>#${p.actual_rank
           ? i0(p.actual_rank) : "—"}</b> of ${i0(placed)} on ${by}${
         move === null ? "" : ` — ${placing}`}.`
      : `There was no history to score them on before the match${p.actual_rank
         ? `; they finished #${i0(p.actual_rank)} of ${i0(placed)} on ${by}`
         : ""}.`}
      ${p.versus_usual ? ` They played <b>${esc(p.versus_usual)}</b>.` : ""}</div>
    ${p.reason ? `<div class="pwhy">“${esc(p.reason)}”</div>` : ""}
    <table class="pstats"><thead><tr><th></th>
      <th>Before${seen ? ` <span class="n">${i0(seen)} game${
        seen === 1 ? "" : "s"}</span>` : ""}</th>
      <th>This match</th><th>Change</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td>
        <td>${r[3]}</td></tr>`).join("")}
      <tr><td>K / D / A</td><td class="mute">${p.recent_kd == null ? "—"
        : Number(p.recent_kd).toFixed(2) + " last 20"}</td>
        <td>${i0(p.kills)} / ${i0(p.deaths)} / ${i0(p.assists)}</td>
        <td class="mute">—</td></tr>
    </tbody></table></div>`;
}

function compareHTML(rv){
  if (!rv || !rv.settled) return "";
  const played = rv.players.filter(p => p.played);
  if (!played.length) return "";
  const sum = rv.summary || {};
  const call = v => v === 1 ? `<span class="beat">right</span>`
                 : v === 0 ? `<span class="under">wrong</span>` : "—";
  const side = t => played.filter(p => p.team === t)
    .sort((a, b) => (a.predicted_rank || 99) - (b.predicted_rank || 99));
  const other = rv.own_team === "Blue" ? "Red" : "Blue";
  // Both rankings run across the lobby, not across a team, so the block has
  // to say what the number is out of or "#6" reads as sixth of five.
  const rated = played.filter(p => p.predicted_rank).length;
  const placed = played.filter(p => p.actual_rank).length;
  const group = (label, list) => !list.length ? "" :
    `<h3>${esc(label)}</h3><div class="pgrid">${
      list.map(p => playerBlock(p, rv, rated, placed)).join("")}</div>`;

  return `<div class="compare"><h2>Predicted against the scoreboard</h2>
    <div class="cmp" style="border:0;padding:0 0 12px"><span class="k">
      Winner ${call(sum.winner_called)} · top pick ${call(sum.top_pick_hit)} ·
      ${i0(sum.within_one)} of ${i0(sum.rated)} players finished within one
      place of where the score put them${sum.order == null ? "" :
        ` · order ${sum.order >= 0 ? "+" : ""}${Number(sum.order).toFixed(2)}`}
    </span></div>
    ${group("Your team", side(rv.own_team))}
    ${group("Enemy team", side(other))}
    <div class="cmp" style="border:0;padding-top:12px"><span class="k">Placing
      is by ${rv.best_by === "performance score"
        ? `the game's own Performance Score in that match. The score's quoted
           accuracy is measured on match impact -- only your own lobbies have
           a Performance Score -- so the two are close kin, not the same`
        : "match impact in that match -- the same measure the score's quoted "
          + "accuracy uses"}. “Before” is the player's own career
      average up to the moment the match started, never including the match
      itself — so the change column is how they played against how they usually
      play, not against the rest of the lobby.</span></div></div>`;
}

/* The matches this dashboard has already recorded.

   The live view follows whatever is happening now, so the moment a match ends
   it drops back to "waiting for a match" and the game just played is gone from
   the screen. Getting back to it used to depend entirely on having caught the
   tab the server popped open at the time -- miss that and the comparison was
   unreachable without typing a URL. */
function ago(t){
  if (!t) return "";
  const mins = Math.round((Date.now() / 1000 - t) / 60);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  const days = Math.round(hrs / 24);
  return days + (days === 1 ? " day ago" : " days ago");
}

function recentHTML(list){
  if (!list || !list.length) return "";
  return `<div class="recent"><h2>Matches this dashboard recorded</h2>
    ${list.map(m => {
      const won = m.own_won === 1;
      const result = !m.settled ? `<span class="wait">waiting for the result</span>`
        : `<b class="${won ? "won" : "lost"}">${won ? "won" : "lost"}${
            m.score ? " " + esc(m.score) : ""}</b>`;
      const call = m.correct === 1 ? `<span class="beat">called it</span>`
                 : m.correct === 0 ? `<span class="under">called it wrong</span>` : "";
      return `<a class="recentrow" href="/m/${encodeURIComponent(m.match_id)}">
        <span class="rmap">${esc(m.map || "—")}</span>
        <span class="rwhen">${esc(ago(m.made_at))}</span>
        <span class="rres">${result}</span>
        <span class="rcall">${call}</span>
        <span class="ropen">${m.settled ? "see the comparison" : "open"} →</span>
      </a>`;
    }).join("")}
    <div class="recentnote">Every match keeps its own page, and it stays after
      the game ends. The scorecard across all of them is at
      <a href="/results">/results</a>.</div></div>`;
}

/* A match in progress has a page of its own too, and this link is the way to
   it: nothing pops up. Only once a prediction is recorded, at the loading
   screen -- in agent select the page does not exist yet, and the cards need
   the room. */
function matchLinkHTML(s){
  const matchId = s.match_id;
  if (!matchId || pinnedMatch() || !s.prediction || s.phase === "pregame")
    return "";
  return `<div class="ownpage"><a href="/m/${encodeURIComponent(matchId)}"
    target="_blank" rel="noopener">This match has its own page — it keeps the
    prediction and fills in the comparison when the game ends ↗</a></div>`;
}

/* ---------------- page ---------------- */
function render(msg){
  if (msg.status === "error"){
    $("map").textContent = "—"; $("sub").textContent = msg.message;
    // The recorded matches stay listed here. Closing the game is what a player
    // does right after finishing one, and that is when they want it.
    $("stage").innerHTML = `<div class="idle">${esc(msg.message)}</div>`
      + recentHTML(msg.recent);
    return;
  }
  /* Sent the moment the socket opens, because the first poll can spend its
     whole deadline resolving ten players. "connecting" for 25 seconds reads
     as broken; saying what it is doing reads as busy. */
  if (msg.status === "working"){
    $("map").textContent = "STARTING";
    $("sub").textContent = msg.message;
    $("stage").innerHTML = `<div class="idle">${esc(msg.message)}…</div>`;
    return;
  }
  /* Between agent select and the match Riot briefly answers neither. The
     cards stay up, and the line under the map says why nothing is moving. */
  if (msg.status === "loading"){
    $("sub").textContent = "Agent select is over — the match is loading";
    if (!STATE) $("stage").innerHTML = `<div class="idle">The match is loading…</div>`;
    return;
  }
  if (msg.status === "lobby"){
    $("map").textContent = "STANDBY"; $("sub").textContent = "waiting for a match";
    $("stage").innerHTML = `<div class="idle">Queue, or start a custom game.</div>`
      + recentHTML(msg.recent);
    STATE = null; return;
  }

  const s = STATE = msg.state;
  if (msg.top1_rate != null) top1 = msg.top1_rate;
  // Re-renders from a click carry no record; keep the one the socket sent.
  if ("record" in msg) RECORD = msg.record;
  if (selected && !s.players.some(p => p.puuid === selected)) selected = null;

  $("map").textContent = s.map || "UNKNOWN MAP";
  setMapArt();
  const phase = s.is_custom ? "Custom" : s.phase === "pregame" ? "Agent select" : "Live";
  // Agent select describes one team, so "of 10" would count five players
  // nobody can see yet.
  const lobby = s.phase === "pregame" ? s.players.length : 10;
  // How many players have history -- not how sure the prediction is, which
  // the track record under the odds says. "High confidence" read as the
  // second while it measured the first.
  $("sub").innerHTML = `${esc(phase)} <b>·</b> ${esc(modeLabel(s.mode))} <b>·</b> ` +
    `${esc(s.coverage)}/${esc(lobby)} known`;

  indexParties(s);

  if (msg.review){ REVIEW = msg.review; REVIEW_ID = s.match_id; }
  else if (REVIEW_ID !== s.match_id){ REVIEW = null; REVIEW_ID = null; }
  const review = REVIEW;
  let head = matchLinkHTML(s);
  for (const w of s.warnings) head += `<div class="warn">${esc(w)}</div>`;
  if ((s.parties || []).some(g => g.source === "inferred"))
    head += `<div class="partynote">Party markers are inferred from who has
      queued together before — the client does not reveal the enemy's parties.
      When one shows it is almost always right; when none shows it means
      unestablished, not solo.</div>`;

  if (s.prediction){
    const own = s.prediction.own_probability;
    const atkPct = isAtk(s.own_team) ? own : 1 - own;
    head += `<div class="odds"><div class="oddsbar">
        <div class="atk" style="width:${atkPct * 100}%">${(atkPct * 100).toFixed(0)}% RED</div>
        <div class="def" style="width:${(1 - atkPct) * 100}%">BLUE ${
          ((1 - atkPct) * 100).toFixed(0)}%</div></div>
      <div class="verdict"><b>${verdict(own)}</b> — you are on ${esc(s.own_team)}.
        Model: ${esc(s.model)}.</div>${trackHTML(s)}</div>`;
  } else if (s.phase !== "pregame") {
    // In agent select the enemy is hidden, which the warnings already say;
    // "not enough known" would blame the lookup for something Riot withholds.
    head += `<div class="warn">Not enough of the roster known to predict yet.</div>`;
  }

  let fx = "";
  if (s.prediction && s.prediction.factors.length){
    /* `predict.top_factors` signs these toward TEAM_A -- Blue -- not toward
       whoever is looking at the screen. Reading the raw sign as "toward you"
       was backwards in every match played on Red, which is half of them: the
       Lotus replay showed five positive factors labelled "toward you" beside
       a 37.9% chance of winning. */
    const ownIsBlue = s.own_team === "Blue";
    const max = Math.max(...s.prediction.factors.map(f => Math.abs(f.value)), .001);
    fx = `<div class="fx"><h2>What moves the prediction</h2>` +
      s.prediction.factors.map(f => {
        const favoursBlue = f.value > 0;
        const toOwn = favoursBlue === ownIsBlue;
        const atk = !favoursBlue;        // Red attacks, Blue defends
        const w = Math.abs(f.value) / max * 50;
        return `<div class="f">
          <span class="dir ${atk ? "toA" : "toB"}">${toOwn ? "toward you" : "toward them"}</span>
          <span class="track"><i style="width:${w}%;background:${
            atk ? "var(--atk)" : "var(--def)"};${
            toOwn ? "left:50%;transform:none" : "right:50%;left:auto;transform:none"}"></i></span>
          <span class="mag num">${Math.abs(f.value).toFixed(3)}</span></div>`;
      }).join("") + `</div>`;
  }

  const keep = $("pbody"), sc = keep ? keep.scrollTop : 0;
  head += resultHTML(review);
  const rosters = s.phase === "pregame" ? pregameHTML(s)
    : `<div class="rosters">${teamHTML(s, "Red")}${teamHTML(s, "Blue")}</div>`;
  $("stage").innerHTML = head + `<div class="grid">
      <div>${rosters}${fx}${compareHTML(review)}</div>
      ${panelHTML(s)}</div>`;
  const now = $("pbody"); if (now) now.scrollTop = sc;

  $("foot").innerHTML =
    `Scores are percentiles within a role — 70 means ahead of 70% of players
     on the same role, so a Sentinel's 70 and a Duelist's 70 mean the same
     thing. Each role is scored on different things. The list is ordered by who
     is most likely to top this scoreboard, which is a different question: a
     duelist is the best player on their team far more often than an initiator
     is, so a lower number can sit above a higher one. ` +
    (top1 != null ? `Picks the strongest of five ${(top1 * 100).toFixed(1)}% of
      the time against 20% by chance: a real edge, not a reliable one. ` : "") +
    `Career figures are raw totals; the score shrinks them toward the population
     average, so a player with few games will show a career damage figure that
     differs from their score component. `
    + `<b>Competitive only, and pooled.</b> Every figure here — damage, K/D, the
     last 20, headshot %, the map record — counts ranked games and nothing
     else; swiftplay, customs and the rotating queues are excluded in the
     query, not by luck. K/D is total kills over total deaths, the same way a
     tracker computes it. Where a figure still differs from one, the cause is
     coverage rather than arithmetic: a player whose history we have not
     fetched deeply enough shows a "last 20" padded with older games. `
    + `Read-only — never writes to the game. `
    + `<a href="/results" style="color:var(--bone-dim)">Session scorecard</a>.`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button.row, button.pcard");
  if (!b || !STATE) return;
  selected = b.dataset.puuid === selected ? null : b.dataset.puuid;
  render({status: "match", state: STATE, top1_rate: top1});
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && selected){
    selected = null;
    if (STATE) render({status: "match", state: STATE, top1_rate: top1});
  }
});

/* /m/<match id> pins this tab to one match: what was predicted there, and the
   result once it lands. The live tab stays on "/" and keeps following the
   current match, so earlier matches are never overwritten by the next one. */
function pinnedMatch(){
  const parts = location.pathname.split("/");
  return parts.length > 2 && parts[1] === "m" ? decodeURIComponent(parts[2]) : "";
}

function connect(){
  const pin = pinnedMatch();
  const ws = new WebSocket(`ws://${location.host}/ws`
    + (pin ? `?pinned=${encodeURIComponent(pin)}` : ""));
  ws.onopen = () => { $("pulse").className = "pulse"; tries = 0; };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => {
    $("pulse").className = "pulse off";
    tries++;
    // "disconnected" on its own is the least useful thing this can say. After
    // two failed attempts the likely cause is that nothing is listening at all
    // -- the page having been restored from cache -- so say that, and say what
    // to do about it. Guessing at this cost a real debugging session.
    $("sub").textContent = tries < 2 ? "reconnecting…"
      : "cannot reach the dashboard server";
    if (tries >= 2) $("stage").innerHTML = `<div class="idle">
      <b style="color:var(--bone)">The dashboard server is not running.</b><br><br>
      This page is still open, but nothing is listening on this port —
      most likely the window running it was closed, or it never started.<br><br>
      Start it again with <b>dashboard.bat</b>, and keep that window open
      while you use this page.</div>`;
    setTimeout(connect, 3000);
  };
}
connect();
</script>
</body>
</html>
