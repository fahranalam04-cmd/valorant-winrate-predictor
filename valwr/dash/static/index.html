<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>valwr live</title>
<style>
  :root{
    --paper:#0e1116; --card:#161a21; --raised:#1c2129; --sunk:#12151b;
    --ink:#e9edf3; --soft:#a4aebc; --faint:#6f7987; --dim:#4d5560;
    --rule:#272d37;
    --red:#e5484d;  --red-sunk:#2a1719;  --red-line:#7a2a2e;
    --blue:#4f9ddb; --blue-sunk:#152331; --blue-line:#2c5c85;
    --warn:#d9a441; --bad:#e07070; --good:#5fbf9f; --you:#f0c674;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  .wrap{max-width:1340px;margin:0 auto;padding:20px 20px 60px}
  .mono,.num{font-variant-numeric:tabular-nums}

  /* ---- header ---- */
  header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;color:var(--faint);font-weight:600;
    letter-spacing:.14em;text-transform:uppercase}
  .mapname{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;
    line-height:1.05}
  .meta{color:var(--faint);font-size:12.5px;margin-top:4px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--good);margin-right:7px;vertical-align:middle}
  .dot.off{background:var(--bad)}

  .bar{display:flex;height:40px;border-radius:5px;overflow:hidden;
    border:1px solid var(--rule);margin-top:16px}
  .bar div{display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:#0e1116;min-width:0}
  .reading{margin-top:7px;color:var(--soft);font-size:13px}

  .note{background:var(--raised);border-left:2px solid var(--warn);
    padding:8px 12px;border-radius:0 4px 4px 0;margin-top:10px;
    color:var(--soft);font-size:12.5px}

  /* ---- layout ---- */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:18px;
    margin-top:20px;align-items:start}
  @media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}

  /* ---- team tables ---- */
  .team{border:1px solid var(--rule);border-radius:6px;overflow:hidden;
    margin-bottom:14px;background:var(--card)}
  .team h2{margin:0;padding:8px 12px;font-size:11px;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;display:flex;
    justify-content:space-between;align-items:baseline;gap:10px}
  .team.red h2{background:var(--red-sunk);color:var(--red);
    border-bottom:1px solid var(--red-line)}
  .team.blue h2{background:var(--blue-sunk);color:var(--blue);
    border-bottom:1px solid var(--blue-line)}
  .team h2 .side{font-weight:600;letter-spacing:.08em;opacity:.72}

  table{width:100%;border-collapse:collapse}
  thead th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);font-weight:600;text-align:right;padding:6px 10px 5px;
    border-bottom:1px solid var(--rule)}
  thead th.l{text-align:left}
  tbody tr{border-bottom:1px solid var(--sunk);cursor:pointer}
  tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:var(--raised)}
  tbody tr.sel{background:var(--raised);box-shadow:inset 3px 0 0 var(--you)}
  tbody tr:focus-visible{outline:2px solid var(--you);outline-offset:-2px}
  td{padding:6px 10px;text-align:right;font-size:13.5px}
  td.l{text-align:left}

  /* known vs unknown: the whole point of the colour split */
  tr.unknown td{color:var(--dim)}
  tr.unknown .nm{color:var(--faint)}
  tr.known{background:var(--raised)}
  tr.known:hover{background:#222834}

  .ico{position:relative;display:block;width:30px;height:30px;border-radius:4px;
    background:var(--sunk);color:var(--faint);font-size:12px;font-weight:700;
    line-height:30px;text-align:center;overflow:hidden;flex:none}
  .ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  td.ic{width:30px;padding-right:0}
  .nm{font-size:13.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .you-tag{color:var(--you);font-size:9.5px;font-weight:700;letter-spacing:.1em;
    margin-left:6px}
  .agname{color:var(--faint);font-size:11px}
  .flagdot{color:var(--warn);margin-left:5px;font-size:11px}

  .sc{font-weight:700;font-size:14px;width:38px}
  /* Form sits one step back from the career figure beside it -- present for
     comparison, not competing with it for attention. */
  td.recent{color:var(--soft)}
  tr.unknown td.recent{color:var(--dim)}
  .scbar{width:46px;height:4px;border-radius:2px;background:var(--sunk);
    overflow:hidden;display:inline-block;vertical-align:middle}
  .scbar i{display:block;height:100%}

  /* ---- detail panel ---- */
  .panel{border:1px solid var(--rule);border-radius:6px;background:var(--card);
    position:sticky;top:18px;overflow:hidden}
  @media(max-width:980px){.panel{position:static}}
  .phero{position:relative;height:186px;background:var(--sunk);overflow:hidden}
  .phero img{position:absolute;left:50%;top:0;height:100%;
    transform:translateX(-50%);object-fit:contain}
  .phero .shade{position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 38%,var(--card) 97%)}
  .phead{position:absolute;left:0;right:0;bottom:0;padding:10px 14px}
  .phead .pn{font-size:17px;font-weight:700;line-height:1.2;
    text-shadow:0 1px 6px rgba(0,0,0,.85)}
  .phead .pa{font-size:11.5px;color:var(--soft);
    text-shadow:0 1px 6px rgba(0,0,0,.85)}
  .pbody{padding:12px 14px 14px;max-height:calc(100vh - 250px);overflow-y:auto}
  @media(max-width:980px){.pbody{max-height:none}}
  .pscore{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
  .pscore b{font-size:30px;line-height:1;font-weight:700}
  .pscore span{color:var(--faint);font-size:11px}
  .preason{color:var(--soft);font-size:12.5px;margin-bottom:12px}

  .sect{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dim);font-weight:700;margin:14px 0 6px;
    border-top:1px solid var(--sunk);padding-top:10px}
  .sect:first-of-type{border-top:0;margin-top:4px;padding-top:0}
  .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px}
  .kv dt{color:var(--faint);min-width:0}
  .kv dd{margin:0;text-align:right;font-weight:600}
  .kv dd.na{color:var(--dim);font-weight:400}
  table.twoup{width:100%;font-size:12.5px}
  table.twoup th{font-size:9px;letter-spacing:.09em;color:var(--dim);
    padding:0 0 4px;border:0}
  table.twoup td{padding:2px 0;text-align:left;color:var(--faint)}
  table.twoup td.num{text-align:right;color:var(--ink);font-weight:600}
  table.twoup .rc{color:var(--soft)}
  table.twoup th.rc{color:var(--dim)}

  .comp{display:flex;justify-content:space-between;gap:8px;font-size:12px;
    padding:2px 0}
  .comp .cl{color:var(--faint)}
  .comp .cv{text-align:right;white-space:nowrap}
  .comp .up{color:var(--good)} .comp .dn{color:var(--bad)}
  .comp .off{color:var(--dim)}

  .form{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap}
  .form i{width:100%;font-style:normal;display:flex;justify-content:space-between;
    gap:8px;font-size:11.5px;padding:2px 0;color:var(--soft)}
  .form i .w{color:var(--good)} .form i .l{color:var(--bad)}

  .agents span{display:inline-block;background:var(--sunk);border-radius:3px;
    padding:1px 6px;margin:2px 3px 0 0;font-size:11px;color:var(--soft)}
  .flagbox{margin-top:10px;padding:7px 10px;border-radius:4px;
    background:#2a1f14;border-left:2px solid var(--warn);color:var(--warn);
    font-size:11.5px}
  .stale{color:var(--warn)}
  .empty{padding:44px 18px;text-align:center;color:var(--dim);font-size:13px}

  .fac{background:var(--card);border:1px solid var(--rule);border-radius:6px;
    padding:11px 14px;margin-top:14px}
  .fac h2{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--dim);margin:0 0 7px;font-weight:700}
  .fac table td{padding:2px 0;font-size:12.5px;text-align:left}
  .fac td.n{text-align:right;color:var(--faint);width:64px}
  .fac td.d{width:88px;font-size:10px;letter-spacing:.05em;
    text-transform:uppercase}
  .toR{color:var(--red)} .toB{color:var(--blue)}

  .idle{color:var(--faint);text-align:center;padding:76px 20px}
  footer{margin-top:24px;padding-top:13px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:11.5px;line-height:1.65}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="flex:1;min-width:200px">
      <h1><span class="dot off" id="live"></span>valwr live</h1>
      <div class="mapname" id="mapname">—</div>
      <div class="meta" id="meta">connecting…</div>
    </div>
  </header>
  <div id="main"></div>
  <footer id="foot"></footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let top1 = null, tries = 0;
let selected = null;      // puuid; survives the 5-second repaint
let lastState = null;

const n1 = v => v == null ? "--" : (Math.round(v * 10) / 10).toFixed(1);
const n2 = v => v == null ? "--" : v.toFixed(2);
const pct = v => v == null ? "--" : (v * 100).toFixed(1) + "%";
const int = v => v == null ? "--" : String(v);

/* Artwork is addressed by the agent's own UUID, which is what the client
   reports and what ref_agents stores. A missing file removes the <img> and
   reveals the lettered tile underneath, so a fresh clone with no art still
   renders a readable scoreboard. */
function tile(p, cls){
  const letter = esc((p.agent || "?").slice(0, 1).toUpperCase());
  const src = p.agent_id ? `/agents/${encodeURIComponent(p.agent_id)}-icon.png` : null;
  return `<span class="${cls}">${letter}` +
    (src ? `<img src="${src}" alt="${esc(p.agent)}" onerror="this.remove()">` : "") +
    `</span>`;
}

function verdict(p){
  const e = Math.abs(p - .5);
  if (e < .015) return "Too close to call";
  const side = p > .5 ? "You are" : "The enemy is";
  if (e < .05) return side + " slightly ahead";
  if (e < .12) return side + " favoured";
  if (e < .25) return side + " clearly favoured";
  return side + " heavily favoured";
}

/* Red attacks and Blue defends for the first half of a bomb-defusal match.
   The client's roster endpoint carries no round or score field, so the swap at
   halftime is not detectable here -- the label says "first half" rather than
   quietly going wrong after round 12. Other modes have no sides at all. */
function sideLabel(state, team){
  if (!state.standard_mode) return "";
  return team === "Red" ? "attacking · first half" : "defending · first half";
}

function teamTable(state, team){
  const rows = state.players.filter(p => p.team === team);
  if (!rows.length) return "";
  const cls = team === "Red" ? "red" : "blue";
  const colour = team === "Red" ? "var(--red)" : "var(--blue)";
  const mine = state.own_team === team ? " · your team" : "";
  const body = rows.map(p => {
    const c = p.career, known = p.score !== null;
    return `<tr tabindex="0" data-puuid="${esc(p.puuid)}"
        class="${known ? "known" : "unknown"}${selected === p.puuid ? " sel" : ""}">
      <td class="ic">${tile(p, "ico")}</td>
      <td class="l">
        <div class="nm">${esc(p.name)}${p.is_you
          ? '<span class="you-tag">YOU</span>' : ""}${p.flag
          ? '<span class="flagdot" title="irregularity flagged">&#9650;</span>' : ""}</div>
        <div class="agname">${esc(p.agent || "picking…")}</div>
      </td>
      <td class="num">${c ? n1(c.acs) : "--"}</td>
      <td class="num">${c ? n2(c.kd) : "--"}</td>
      <td class="num recent" title="last ${p.recent ? p.recent.games : 20} matches"
        >${p.recent ? n2(p.recent.kd) : "--"}</td>
      <td class="num">${c ? pct(c.headshot_rate) : "--"}</td>
      <td class="num sc" style="color:${known ? colour : "var(--dim)"}">
        ${known ? p.score : "--"}</td>
      <td style="width:52px"><span class="scbar"><i style="width:${
        known ? p.score : 0}%;background:${colour}"></i></span></td>
    </tr>`;
  }).join("");
  return `<div class="team ${cls}">
    <h2><span>${team}${esc(mine)}</span><span class="side">${
      esc(sideLabel(state, team))}</span></h2>
    <table>
      <thead><tr>
        <th class="l" colspan="2">player</th>
        <th>acs</th><th>k/d</th><th title="over the last 20 matches">k/d&nbsp;20</th><th>hs%</th>
        <th colspan="2">score</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>`;
}

function statList(s){
  if (!s || !s.games) return `<div class="comp off">no games on record</div>`;
  const row = (k, v, na) => `<dt>${k}</dt><dd class="${na ? "na" : ""}">${v}</dd>`;
  return `<dl class="kv">
    ${row("games", int(s.games))}
    ${row("record", `${int(s.wins)}W &ndash; ${int(s.losses)}L`)}
    ${row("win rate", pct(s.win_rate), s.win_rate == null)}
    ${row("ACS", n1(s.acs), s.acs == null)}
    ${row("K / D / A", `${int(s.kills)} / ${int(s.deaths)} / ${int(s.assists)}`)}
    ${row("K/D", n2(s.kd), s.kd == null)}
    ${row("headshot %", pct(s.headshot_rate), s.headshot_rate == null)}
  </dl>`;
}

/* Career against form. When the player has fewer stored matches than the
   window, the two columns are the same rows and printing both would invent a
   comparison -- the median player in this database has 8 stored matches, so
   that is the common case, not the edge case. */
function twoUp(career, recent, window){
  if (!career || !career.games) return statList(career);
  const same = !recent || recent.games >= career.games;
  if (same) return statList(career) +
    `<div class="comp off" style="margin-top:5px">All ${career.games} stored
     matches are inside the last ${window}, so recent form and career are the
     same games.</div>`;
  const row = (k, a, b) => `<tr><td>${k}</td><td class="num">${a}</td>
    <td class="num rc">${b}</td></tr>`;
  return `<table class="twoup">
    <thead><tr><th></th><th class="num">career</th>
      <th class="num rc">last ${recent.games}</th></tr></thead><tbody>
    ${row("games", career.games, recent.games)}
    ${row("ACS", n1(career.acs), n1(recent.acs))}
    ${row("K/D", n2(career.kd), n2(recent.kd))}
    ${row("headshot %", pct(career.headshot_rate), pct(recent.headshot_rate))}
    ${row("win rate", pct(career.win_rate), pct(recent.win_rate))}
    ${row("K / D / A",
          `${int(career.kills)}/${int(career.deaths)}/${int(career.assists)}`,
          `${int(recent.kills)}/${int(recent.deaths)}/${int(recent.assists)}`)}
    </tbody></table>`;
}

function panel(state){
  const p = state.players.find(x => x.puuid === selected);
  if (!p) return `<div class="panel"><div class="empty">
    Select a player to see their agent, career stats,<br>
    and how they perform on ${esc(state.map || "this map")}.</div></div>`;

  const art = p.agent_id
    ? `/agents/${encodeURIComponent(p.agent_id)}-portrait.png` : null;
  const d = p.detail;
  const colour = p.team === "Red" ? "var(--red)" : "var(--blue)";

  let body = "";
  if (!d){
    body = `<div class="empty" style="padding:26px 0">
      No match history for this player.<br>
      <span style="font-size:11.5px">They are in the lobby and counted, but
      nothing is known about them yet.</span></div>`;
  } else {
    const m = d.map;
    const comps = d.components.map(c => {
      const gated = c.key === "map_edge" && !m.counts_toward_score;
      const dir = gated ? "off" : (c.contribution > 0 ? "up"
                 : c.contribution < 0 ? "dn" : "off");
      return `<div class="comp"><span class="cl">${esc(c.label)}</span>
        <span class="cv ${dir}">${esc(c.note)}</span></div>`;
    }).join("");

    const agents = m.agents && m.agents.length
      ? `<div class="agents">${m.agents.slice(0, 5).map(a =>
          `<span>${esc(a.agent)} &times;${a.games}</span>`).join("")}</div>`
      : "";

    const form = d.form && d.form.length
      ? `<div class="form">${d.form.map(f => `<i>
          <span>${esc(f.map || "?")} &middot; ${esc(f.agent || "?")}</span>
          <span><span class="${f.won === null ? "" : (f.won ? "w" : "l")}">${
            f.won === null ? "&ndash;" : (f.won ? "W" : "L")}</span>
          &nbsp;${n1(f.acs)} acs &nbsp;${int(f.kills)}/${int(f.deaths)}
          &nbsp;<span style="color:var(--dim)">${esc(f.ago)}</span></span>
        </i>`).join("")}</div>`
      : "";

    body = `
      <div class="pscore"><b style="color:${colour}">${p.score}</b>
        <span>out of 100</span></div>
      <div class="preason">${esc(p.reason)}</div>
      ${p.flag ? `<div class="flagbox">${esc(p.flag.note)}</div>` : ""}

      <div class="sect">what makes the score</div>${comps}

      <div class="sect">career &amp; recent form</div>
      ${twoUp(d.career, d.recent, d.recent_window || 20)}

      <div class="sect">on ${esc(m.name)}</div>
      ${m.games ? statList(m) + (m.counts_toward_score ? "" :
        `<div class="comp off" style="margin-top:4px">under ${m.gate} games
         &mdash; not counted toward the score</div>`) + agents
        : `<div class="comp off">never played this map</div>`}

      ${form ? `<div class="sect">recent form</div>${form}` : ""}

      <div class="sect">data</div>
      <div class="comp"><span class="cl">${
        d.freshness.stale ? '<span class="stale">out of date</span>' : "freshness"
        }</span><span class="cv">${esc(d.freshness.label)}</span></div>
      <div class="comp"><span class="cl">games on record</span>
        <span class="cv">${int(d.freshness.games_known)}</span></div>`;
  }

  return `<div class="panel">
    <div class="phero">
      ${art ? `<img src="${art}" alt="" onerror="this.remove()">` : ""}
      <div class="shade"></div>
      <div class="phead">
        <div class="pn">${esc(p.name)}</div>
        <div class="pa">${esc(p.agent || "picking…")}${
          p.role ? " &middot; " + esc(p.role) : ""} &middot; ${esc(p.team)}</div>
      </div>
    </div>
    <div class="pbody" id="pbody">${body}</div>
  </div>`;
}

function render(msg){
  if (msg.status === "error"){
    $("meta").textContent = msg.message;
    $("mapname").textContent = "—";
    $("main").innerHTML = `<div class="idle">${esc(msg.message)}</div>`;
    return;
  }
  if (msg.status === "lobby"){
    $("mapname").textContent = "Not in a match";
    $("meta").textContent = "connected — waiting for a match";
    $("main").innerHTML = `<div class="idle">Queue, or start a custom game.<br>
      This fills in the moment you load in.</div>`;
    lastState = null;
    return;
  }

  const s = lastState = msg.state;
  if (msg.top1_rate != null) top1 = msg.top1_rate;
  if (selected && !s.players.some(p => p.puuid === selected)) selected = null;

  $("mapname").textContent = s.map || "Unknown map";
  const kind = s.is_custom ? "Custom" : (s.phase === "pregame"
    ? "Agent select" : "In game");
  $("meta").textContent =
    `${kind} · ${s.mode || "unknown mode"} · ${s.coverage}/10 players known` +
    ` — ${s.confidence} confidence`;

  let head = "";
  for (const w of s.warnings) head += `<div class="note">${esc(w)}</div>`;

  if (s.prediction){
    const own = s.prediction.own_probability;
    const ownRed = s.own_team === "Red";
    const a = ownRed ? "var(--red)" : "var(--blue)";
    const b = ownRed ? "var(--blue)" : "var(--red)";
    head += `<div class="bar">
        <div style="width:${own * 100}%;background:${a}">${(own * 100).toFixed(0)}%</div>
        <div style="width:${(1 - own) * 100}%;background:${b}">${
          ((1 - own) * 100).toFixed(0)}%</div>
      </div>
      <div class="reading">${verdict(own)} — your team (${esc(s.own_team)})
        on the left. Model: ${esc(s.model)}.</div>`;
  } else {
    head += `<div class="note">Not enough of the roster known to predict yet.</div>`;
  }

  let fac = "";
  if (s.prediction && s.prediction.factors.length){
    const ownRed = s.own_team === "Red";
    fac = `<div class="fac"><h2>What pushed the prediction</h2><table>` +
      s.prediction.factors.map(f => {
        const toOwn = f.value > 0;
        const cls = (toOwn === ownRed) ? "toR" : "toB";
        return `<tr>
          <td class="d ${cls}">${toOwn ? "toward you" : "toward them"}</td>
          <td>${esc(f.name.replace(/^d_/, "").replace(/_/g, " "))}</td>
          <td class="n">${Math.abs(f.value).toFixed(3)}</td></tr>`;
      }).join("") + `</table></div>`;
  }

  // Panel scroll is restored after the repaint, or reading a card while the
  // socket ticks every five seconds throws you back to the top.
  const keep = document.getElementById("pbody");
  const scroll = keep ? keep.scrollTop : 0;

  $("main").innerHTML = head + `<div class="grid">
      <div>${teamTable(s, "Red")}${teamTable(s, "Blue")}${fac}</div>
      <div>${panel(s)}</div>
    </div>`;

  const now = document.getElementById("pbody");
  if (now) now.scrollTop = scroll;

  $("foot").innerHTML =
    `Scores are percentiles: 70 means likely to outperform 70% of players. ` +
    (top1 != null
      ? `Picks the best player of five ${(top1 * 100).toFixed(1)}% of the time
         against 20% by chance — a real edge, not a reliable one. `
      : `A real edge over chance, not a reliable one. `) +
    `Career stats are raw totals; the score shrinks them toward the population
     average, so a player with few games will show a career ACS that differs
     from their score component. Read-only: never writes to the game.`;
}

/* Delegated, because the whole roster is replaced on every poll. */
document.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-puuid]");
  if (!tr || !lastState) return;
  selected = tr.dataset.puuid === selected ? null : tr.dataset.puuid;
  render({status: "match", state: lastState, top1_rate: top1});
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && selected){
    selected = null;
    if (lastState) render({status: "match", state: lastState, top1_rate: top1});
    return;
  }
  const tr = e.target.closest && e.target.closest("tr[data-puuid]");
  if (tr && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    tr.click();
  }
});

function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("live").className = "dot"; tries = 0; };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => {
    $("live").className = "dot off";
    tries++;
    // "disconnected" on its own is the least useful thing this can say. After
    // a couple of failed attempts the likely cause is that the server is not
    // running at all -- the page having been restored from cache -- so say so.
    $("meta").textContent = tries < 2
      ? "disconnected — retrying…"
      : "Cannot reach the dashboard server.";
    if (tries >= 2) $("main").innerHTML = `<div class="idle">
      <b>The dashboard server is not running.</b><br><br>
      This page is still open, but nothing is listening on this port —
      most likely the window running it was closed, or it never started.<br><br>
      Start it again by double-clicking <b>dashboard.bat</b>, and keep that
      window open while you use this page.</div>`;
    setTimeout(connect, 3000);
  };
}
connect();
</script>
