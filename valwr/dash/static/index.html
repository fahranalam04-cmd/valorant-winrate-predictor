<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>valwr live</title>
<style>
  :root{
    --paper:#0f1218; --card:#171b23; --card2:#1d222c; --sunk:#12151c;
    --ink:#e7eaef; --soft:#a9b2bf; --faint:#77808e;
    --rule:#2a303a;
    --you:#e0736d; --you-dim:#3a2422;
    --them:#6fa8c7; --them-dim:#1b2a34;
    --warn:#d6ac63; --bad:#e08080; --good:#6fbfa8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.55 "Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--faint);font-size:12.5px;margin-top:3px}
  .mono{font-family:"Cascadia Mono",Consolas,monospace;
    font-variant-numeric:tabular-nums}

  .bar{display:flex;height:44px;border-radius:6px;overflow:hidden;
    border:1px solid var(--rule);margin-top:16px}
  .bar div{display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:16px;color:#0f1218;min-width:0}
  .bar .a{background:var(--you)} .bar .b{background:var(--them)}
  .reading{margin-top:8px;color:var(--soft);font-size:13.5px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  .side{background:var(--card);border:1px solid var(--rule);border-radius:6px;
    padding:12px 14px}
  .side.you{border-top:2px solid var(--you)}
  .side.them{border-top:2px solid var(--them)}
  .side h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);margin:0 0 10px;font-weight:600}

  .p{padding:7px 0;border-bottom:1px solid var(--sunk)}
  .p:last-child{border-bottom:0}
  .prow{display:grid;grid-template-columns:1.4em 1fr auto 2.4em;gap:8px;
    align-items:baseline}
  .rank{color:var(--faint);font-size:12px}
  .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .nm.me{color:var(--you);font-weight:600}
  .ag{color:var(--faint);font-size:12px}
  .sc{text-align:right;font-weight:700;font-size:14.5px}
  .why{color:var(--faint);font-size:11.5px;margin-top:1px;padding-left:2.2em}
  .meter{height:3px;border-radius:2px;background:var(--sunk);margin-top:5px;
    margin-left:2.2em;overflow:hidden}
  .meter i{display:block;height:100%}
  .flag{margin:5px 0 2px 2.2em;padding:5px 8px;border-radius:4px;
    background:#2a1f14;border-left:2px solid var(--warn);
    color:var(--warn);font-size:11.5px}

  .panel{background:var(--card);border:1px solid var(--rule);border-radius:6px;
    padding:12px 14px;margin-top:16px}
  .panel h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);margin:0 0 9px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:3px 0}
  td.n{text-align:right;color:var(--faint);width:70px}
  td.d{width:78px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  .toA{color:var(--you)} .toB{color:var(--them)}

  .note{background:var(--card2);border-left:2px solid var(--warn);
    padding:9px 12px;border-radius:0 4px 4px 0;margin-top:10px;
    color:var(--soft);font-size:12.5px}
  .idle{color:var(--faint);text-align:center;padding:70px 20px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--good);margin-right:6px}
  .dot.off{background:var(--bad)}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);
    color:var(--faint);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot off" id="live"></span>valwr live</h1>
  <div class="sub" id="sub">connecting…</div>
  <div id="main"></div>
  <footer id="foot"></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let top1 = null;

function verdict(p){
  const e = Math.abs(p - .5);
  if (e < .015) return "Too close to call";
  const side = p > .5 ? "You are" : "The enemy is";
  if (e < .05) return side + " slightly ahead";
  if (e < .12) return side + " favoured";
  if (e < .25) return side + " clearly favoured";
  return side + " heavily favoured";
}

function side(state, team, label, cls){
  const rows = state.players.filter(p => p.team === team);
  if (!rows.length) return "";
  const tint = cls === "you" ? "var(--you)" : "var(--them)";
  return `<div class="side ${cls}"><h2>${esc(label)}</h2>` + rows.map((p, i) => `
    <div class="p">
      <div class="prow">
        <span class="rank">${i + 1}</span>
        <span class="nm${p.is_you ? " me" : ""}">${esc(p.name)}</span>
        <span class="ag">${esc(p.agent)}</span>
        <span class="sc" style="color:${p.score === null ? "var(--faint)" : tint}">
          ${p.score === null ? "--" : p.score}</span>
      </div>
      <div class="meter"><i style="width:${p.score || 0}%;background:${tint}"></i></div>
      <div class="why">${esc(p.reason)}</div>
      ${p.flag ? `<div class="flag">${esc(p.flag.note)}</div>` : ""}
    </div>`).join("") + "</div>";
}

function render(msg){
  if (msg.status === "error"){
    $("sub").textContent = msg.message;
    $("main").innerHTML = `<div class="idle">${esc(msg.message)}</div>`;
    return;
  }
  if (msg.status === "lobby"){
    $("sub").textContent = "connected — waiting for a match";
    $("main").innerHTML = `<div class="idle">Not in a match.<br>
      Queue, or start a custom game.</div>`;
    return;
  }
  const s = msg.state;
  if (msg.top1_rate != null) top1 = msg.top1_rate;

  const kind = s.is_custom ? "Custom" : (s.phase === "pregame"
    ? "Agent select" : "In game");
  $("sub").textContent =
    `${kind} · ${s.map || "unknown map"} · ${s.mode || "unknown mode"} · ` +
    `${s.coverage}/10 players known — ${s.confidence} confidence`;

  let html = "";
  for (const w of s.warnings) html += `<div class="note">${esc(w)}</div>`;

  if (s.prediction){
    const own = s.prediction.own_probability;
    html += `<div class="bar">
        <div class="a" style="width:${own * 100}%">${(own * 100).toFixed(0)}%</div>
        <div class="b" style="width:${(1 - own) * 100}%">${((1 - own) * 100).toFixed(0)}%</div>
      </div>
      <div class="reading">${verdict(own)} — your team on the left.
        Model: ${esc(s.model)}.</div>`;
  } else {
    html += `<div class="note">Not enough of the roster known to predict yet.</div>`;
  }

  html += `<div class="cols">
    ${side(s, s.own_team, "Your team (" + s.own_team + ")", "you")}
    ${side(s, s.enemy_team, "Enemy (" + s.enemy_team + ")", "them")}
  </div>`;

  if (s.prediction && s.prediction.factors.length){
    html += `<div class="panel"><h2>What pushed the prediction</h2><table>` +
      s.prediction.factors.map(f => `<tr>
        <td class="d ${f.value > 0 ? "toA" : "toB"}">${f.value > 0 ? "toward you" : "toward them"}</td>
        <td>${esc(f.name.replace(/^d_/, "").replace(/_/g, " "))}</td>
        <td class="n">${Math.abs(f.value).toFixed(3)}</td></tr>`).join("") +
      `</table></div>`;
  }
  $("main").innerHTML = html;

  $("foot").innerHTML =
    "Scores are percentiles: 70 means likely to outperform 70% of players. " +
    (top1 != null
      ? `Picks the best player of five ${(top1 * 100).toFixed(1)}% of the time
         against 20% chance — a real edge, not a reliable one.`
      : "A real edge over chance, not a reliable one.") +
    " Read-only: never writes to the game.";
}

function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("live").className = "dot"; };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => {
    $("live").className = "dot off";
    $("sub").textContent = "disconnected — retrying…";
    setTimeout(connect, 3000);
  };
}
connect();
</script>
</body>
</html>
