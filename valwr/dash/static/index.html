<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>valwr live — broadcast</title>
<style>
/* ==========================================================================
   Palette taken from VALORANT's own UI rather than invented: the signature
   red, the deep desaturated navy the menus sit on, and the warm off-white
   Riot uses for type. Attack red / defend cyan is the in-game side language.

   Type is Bahnschrift -- Microsoft's DIN, already installed on Windows -- for
   the condensed uppercase that game reads in, with Segoe UI carrying body
   text. Nothing is fetched: this page must not make a network request while
   you are loading into a match, which is the same reason the agent art is
   downloaded ahead of time rather than hotlinked.
   ========================================================================== */
:root{
  /* One palette. Panels are near-opaque so they carry their own readability,
     which is what lets the scrim over the map stay light -- an earlier version
     dimmed the page to 93% black to protect the type and buried the artwork
     with it. */
  --void:#070a0e; --steel:rgba(10,15,22,.90); --steel-2:rgba(17,25,35,.90);
  --sunk:rgba(6,9,13,.84);
  --line:rgba(140,175,200,.30); --line-soft:rgba(140,175,200,.16);
  --bone:#f4f7fa; --bone-dim:#bccbd7; --slate:#8fa2b1; --ghost:#63727f;
  --val:#ff4655; --atk:#ff5865; --def:#38d8e4; --val-deep:#3d1218;
  --gold:#e7c27d; --win:#3ad6a0;
  --display:"Bahnschrift","DIN Alternate","Oswald","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
}

/* --- the map behind everything ----------------------------------------
   The map's own key art, blurred and dimmed hard enough that type still
   passes contrast on it, with the panels frosted so the art reads through.
   --mapart is set from JS per match; with no art the gradient alone stands. */
body{
  background-image:var(--mapart,none);
  background-size:cover;background-position:center 26%;
  background-attachment:fixed;background-repeat:no-repeat}

/* Two layers, and the order matters. The vignette darkens the edges where
   type sits closest to the artwork and stays light through the middle, so the
   map is legible as a place rather than as texture. Blur is 3px, not 11 --
   enough to keep detail from competing with small text, not so much that
   Ascent stops looking like Ascent. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  backdrop-filter:blur(3px) saturate(1.14) contrast(1.04);
  background:
    radial-gradient(128% 86% at 50% 14%,
      rgba(5,8,12,.16) 0%, rgba(5,8,12,.44) 46%, rgba(5,8,12,.80) 100%),
    linear-gradient(180deg, rgba(5,8,12,.18) 0%, rgba(5,8,12,.36) 55%,
      rgba(5,8,12,.62) 100%)}
/* Roughly 30% darkened behind the map name and 92% at the lower corners. The
   bright maps -- Breeze, Sunset -- are what set the top figure: any lighter
   and the small uppercase subheading stops holding against sand. */

/* The page gets more air in this theme than the others, because the gaps are
   where the map is actually seen. */
body .shell{padding:26px 30px 72px}
body .grid{gap:26px}
.rosters{gap:22px}
body .team{margin-bottom:26px}
body .row{margin-bottom:7px}

body .row,body .panel,
body .fx{backdrop-filter:blur(9px) saturate(1.1);
  box-shadow:0 6px 22px rgba(0,0,0,.42)}
/* The agent art inside a row now has the map behind it as well, so it steps
   back to keep the two from fighting. */
body .art{opacity:.34}
body .row.known{border-top:1px solid rgba(255,255,255,.05)}

/* Header type sits directly on the artwork, so it carries its own shadow
   rather than relying on the scrim. */
body .map{
  text-shadow:0 2px 4px rgba(0,0,0,.55),0 6px 30px rgba(0,0,0,.85)}
body .mapsub,body .brand,
body .verdict{text-shadow:0 1px 10px rgba(0,0,0,.9)}
body .top{border-bottom-color:rgba(160,195,220,.26)}

/* --- the two teams sit side by side, so the map shows between them --- */
.rosters{display:grid;
  grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:980px){.rosters{
  grid-template-columns:1fr}}

/* --- the picker -------------------------------------------------------- */
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="mapwrap">
      <div class="brand"><span class="pulse off" id="pulse"></span>valwr live</div>
      <h1 class="map" id="map">—</h1>
      <div class="mapsub" id="sub">connecting</div>
    </div>
  </div>
  <div id="stage"><div class="idle">connecting…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n1 = v => v == null ? "—" : v.toFixed(1);
const n2 = v => v == null ? "—" : v.toFixed(2);
const pc = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
const i0 = v => v == null ? "—" : String(v);

let STATE = null, selected = null, top1 = null, tries = 0;

/* The map's own key art is the background, so it changes with the match.
   `--mapart` is set from the state rather than from a stylesheet because the
   map is only known at runtime; the file is named by the lowercased map name,
   which is exactly what the live state carries. A map with no art on disk
   simply resolves to `none` and the gradient scrim stands on its own. */
function setMapArt(){
  const name = STATE && STATE.map
    ? STATE.map.toLowerCase().replace(/[^a-z0-9]/g, "") : "";
  document.body.style.setProperty("--mapart",
    name ? `url("/maps/${name}-splash.jpg")` : "none");
}

const artURL = (p, k) =>
  p.agent_id ? `/agents/${encodeURIComponent(p.agent_id)}-${k}.png` : "";
const isAtk = t => t === "Red";

function verdict(p){
  const e = Math.abs(p - .5);
  if (e < .015) return "Too close to call";
  const s = p > .5 ? "Your side is" : "The enemy is";
  if (e < .05) return s + " marginally ahead";
  if (e < .12) return s + " favoured";
  if (e < .25) return s + " clearly favoured";
  return s + " heavily favoured";
}

/* ---------------- roster ---------------- */
function rowHTML(p){
  const c = p.career, r = p.recent, known = p.score !== null;
  const stat = (label, val, cls) =>
    `<div class="st ${cls || ""}"><b class="num">${val}</b><span>${label}</span></div>`;
  return `<button class="row ${known ? "known" : "unknown"}${
      selected === p.puuid ? " sel" : ""}" data-puuid="${esc(p.puuid)}"
      aria-pressed="${selected === p.puuid}">
    ${p.agent_id ? `<img class="art" src="${artURL(p, "row")}" alt=""
        decoding="async" onerror="this.remove()">` : ""}
    <div class="score">${known ? p.score : '<span class="u">—</span>'}</div>
    <div class="who">
      <div class="nm">${esc(p.name)}${p.is_you ? '<span class="tag">YOU</span>' : ""}${
        p.flag ? '<span class="alert" title="irregularity flagged">◆</span>' : ""}</div>
      <div class="rs"><span class="ag">${esc(p.agent || "selecting")}</span>
        &nbsp;·&nbsp;${esc(p.reason)}</div>
    </div>
    ${stat("acs", c ? n1(c.acs) : "—")}
    ${stat("k/d", c ? n2(c.kd) : "—")}
    ${stat("last 20", r ? n2(r.kd) : "—", "form")}
    ${stat("hs%", c ? pc(c.headshot_rate) : "—")}
  </button>`;
}

function teamHTML(s, team){
  const players = s.players.filter(p => p.team === team);
  if (!players.length) return "";
  const atk = isAtk(team);
  const side = s.standard_mode ? (atk ? "attacking · first half"
                                      : "defending · first half") : "";
  const known = players.filter(p => p.score !== null).length;
  return `<section class="team ${atk ? "atkc" : "defc"}">
    <div class="tbar">
      <span class="tname">${esc(team)}</span>
      <span class="tside">${esc(side)}</span>
      <span class="trule"></span>
      <span class="tcount">${s.own_team === team ? "your side · " : ""}${
        known}/${players.length} known</span>
    </div>
    ${players.map(rowHTML).join("")}
  </section>`;
}

/* ---------------- panel ---------------- */
/* `recent` is null when this renders a single tally -- the per-map block --
   and a Career when it compares record against form. The note below only
   makes sense in the second case: with no window there is nothing for the
   games to fall inside, and it printed "the last 0" under every map. */
function twoUp(career, recent, win){
  if (!career || !career.games)
    return `<div class="cmp"><span class="k">no games on record</span></div>`;
  const same = !recent || recent.games >= career.games;
  const line = (k, a, b) => `<tr><td>${k}</td><td class="n">${a}</td>${
    same ? "" : `<td class="n f">${b}</td>`}</tr>`;
  return `<table class="tw">
    <thead><tr><th class="l"></th><th>career</th>${
      same ? "" : `<th>last ${recent.games}</th>`}</tr></thead><tbody>
    ${line("Games", i0(career.games), i0(recent && recent.games))}
    ${line("ACS", n1(career.acs), n1(recent && recent.acs))}
    ${line("K/D", n2(career.kd), n2(recent && recent.kd))}
    ${line("Headshot %", pc(career.headshot_rate), pc(recent && recent.headshot_rate))}
    ${line("Win rate", pc(career.win_rate), pc(recent && recent.win_rate))}
    ${line("K / D / A", `${i0(career.kills)}/${i0(career.deaths)}/${i0(career.assists)}`,
        recent ? `${i0(recent.kills)}/${i0(recent.deaths)}/${i0(recent.assists)}` : "—")}
    </tbody></table>${same && recent ? `<div class="cmp"
      style="border:0;padding-top:7px"><span class="k">All ${career.games}
      stored matches fall inside the last ${win}, so form and career are the
      same games.</span></div>` : ""}`;
}

function panelHTML(s){
  const p = s.players.find(x => x.puuid === selected);
  if (!p) return `<aside class="panel"><div class="hint">
      Select any player for their agent, career record,<br>
      recent form and how they play ${esc(s.map || "this map")}.
      <div style="margin-top:14px"><span class="kbd">ESC</span> closes</div>
    </div></aside>`;

  const accent = isAtk(p.team) ? "var(--atk)" : "var(--def)";
  const d = p.detail;
  let body;

  if (!d){
    body = `<div class="pcol" style="grid-column:1/-1"><div class="hint"
      style="padding:30px 0">
      <b style="color:var(--bone-dim)">No match history.</b><br>
      They are in the lobby and counted in the prediction,<br>
      but nothing is known about how they play.</div></div>`;
  } else {
    const m = d.map;
    const comps = d.components.map(c => {
      const gated = c.key === "map_edge" && !m.counts_toward_score;
      const cls = gated ? "mute" : c.contribution > 0 ? "up"
                : c.contribution < 0 ? "dn" : "mute";
      return `<div class="cmp"><span class="k">${esc(c.label)}</span>
        <span class="v ${cls}">${esc(c.note)}</span></div>`;
    }).join("");

    const mapBlock = m.games
      ? twoUp(m, null, 0) + (m.counts_toward_score ? ""
          : `<div class="cmp" style="border:0"><span class="k">Under ${m.gate}
             games here, so the map does not move the score.</span></div>`)
        + (m.agents && m.agents.length ? `<div class="chips">${
            m.agents.slice(0, 5).map(a =>
              `<span>${esc(a.agent)} ×${a.games}</span>`).join("")}</div>` : "")
      : `<div class="cmp"><span class="k">Never played this map.</span></div>`;

    const form = (d.form || []).map(f => `<div class="formrow">
        <span>${esc(f.map || "?")} <span class="when">·</span> ${esc(f.agent || "?")}</span>
        <span><span class="${f.won === null ? "" : f.won ? "w" : "l"}">${
          f.won === null ? "–" : f.won ? "W" : "L"}</span>
          <span class="num">&nbsp;${n1(f.acs)}</span>
          <span class="num">&nbsp;${i0(f.kills)}/${i0(f.deaths)}</span>
          <span class="when">&nbsp;${esc(f.ago)}</span></span></div>`).join("");

    // Split by kind, not by length: everything explaining the number on the
    // left, everything describing where and when on the right.
    body = `
      <div class="pcol">
        <div class="bigscore"><b style="color:${accent}">${p.score}</b>
          <span>of 100</span></div>
        <div class="pwhy">${esc(p.reason)}</div>
        ${p.flag ? `<div class="flag">${esc(p.flag.note)}</div>` : ""}
        <div class="sect">what makes the score</div>${comps}
        <div class="sect">record &amp; form</div>
        ${twoUp(d.career, d.recent, d.recent_window || 20)}
      </div>
      <div class="pcol">
        <div class="sect">on ${esc(m.name)}</div>${mapBlock}
        ${form ? `<div class="sect">last matches</div>${form}` : ""}
        <div class="sect">data</div>
        <div class="cmp"><span class="k">Freshness</span>
          <span class="v ${d.freshness.stale ? "stale" : ""}">${
            esc(d.freshness.label)}</span></div>
        <div class="cmp"><span class="k">Matches on record</span>
          <span class="v">${i0(d.freshness.games_known)}</span></div>
      </div>`;
  }

  return `<aside class="panel">
    <div class="phero">
      <div class="stripe" style="background:${accent}"></div>
      ${p.agent_id ? `<img src="${artURL(p, "portrait")}" alt=""
          decoding="async" onerror="this.remove()">` : ""}
      <div class="veil"></div>
      <div class="pid"><div class="pn">${esc(p.name)}</div>
        <div class="pa">${esc(p.agent || "selecting")}${
          p.role ? " · " + esc(p.role) : ""} · ${esc(p.team)}</div></div>
    </div>
    <div class="pbody" id="pbody">${body}</div>
  </aside>`;
}

/* ---------------- page ---------------- */
function render(msg){
  if (msg.status === "error"){
    $("map").textContent = "—"; $("sub").textContent = msg.message;
    $("stage").innerHTML = `<div class="idle">${esc(msg.message)}</div>`;
    return;
  }
  if (msg.status === "lobby"){
    $("map").textContent = "STANDBY"; $("sub").textContent = "waiting for a match";
    $("stage").innerHTML = `<div class="idle">Queue, or start a custom game.</div>`;
    STATE = null; return;
  }

  const s = STATE = msg.state;
  if (msg.top1_rate != null) top1 = msg.top1_rate;
  if (selected && !s.players.some(p => p.puuid === selected)) selected = null;

  $("map").textContent = s.map || "UNKNOWN MAP";
  setMapArt();
  const phase = s.is_custom ? "Custom" : s.phase === "pregame" ? "Agent select" : "Live";
  $("sub").innerHTML = `${esc(phase)} <b>·</b> ${esc(s.mode || "—")} <b>·</b> ` +
    `${s.coverage}/10 known <b>·</b> ${esc(s.confidence)} confidence`;

  let head = "";
  for (const w of s.warnings) head += `<div class="warn">${esc(w)}</div>`;

  if (s.prediction){
    const own = s.prediction.own_probability;
    const atkPct = isAtk(s.own_team) ? own : 1 - own;
    head += `<div class="odds"><div class="oddsbar">
        <div class="atk" style="width:${atkPct * 100}%">${(atkPct * 100).toFixed(0)}% RED</div>
        <div class="def" style="width:${(1 - atkPct) * 100}%">BLUE ${
          ((1 - atkPct) * 100).toFixed(0)}%</div></div>
      <div class="verdict"><b>${verdict(own)}</b> — you are on ${esc(s.own_team)}.
        Model: ${esc(s.model)}.</div></div>`;
  } else {
    head += `<div class="warn">Not enough of the roster known to predict yet.</div>`;
  }

  let fx = "";
  if (s.prediction && s.prediction.factors.length){
    /* `predict.top_factors` signs these toward TEAM_A -- Blue -- not toward
       whoever is looking at the screen. Reading the raw sign as "toward you"
       was backwards in every match played on Red, which is half of them: the
       Lotus replay showed five positive factors labelled "toward you" beside
       a 37.9% chance of winning. */
    const ownIsBlue = s.own_team === "Blue";
    const max = Math.max(...s.prediction.factors.map(f => Math.abs(f.value)), .001);
    fx = `<div class="fx"><h2>What moves the prediction</h2>` +
      s.prediction.factors.map(f => {
        const favoursBlue = f.value > 0;
        const toOwn = favoursBlue === ownIsBlue;
        const atk = !favoursBlue;        // Red attacks, Blue defends
        const w = Math.abs(f.value) / max * 50;
        return `<div class="f">
          <span class="dir ${atk ? "toA" : "toB"}">${toOwn ? "toward you" : "toward them"}</span>
          <span class="track"><i style="width:${w}%;background:${
            atk ? "var(--atk)" : "var(--def)"};${
            toOwn ? "left:50%;transform:none" : "right:50%;left:auto;transform:none"}"></i></span>
          <span class="mag num">${Math.abs(f.value).toFixed(3)}</span></div>`;
      }).join("") + `</div>`;
  }

  const keep = $("pbody"), sc = keep ? keep.scrollTop : 0;
  $("stage").innerHTML = head + `<div class="grid">
      <div><div class="rosters">${teamHTML(s, "Red")}${teamHTML(s, "Blue")}</div>${fx}</div>
      ${panelHTML(s)}</div>`;
  const now = $("pbody"); if (now) now.scrollTop = sc;

  $("foot").innerHTML =
    `Scores are percentiles — 70 means likely to outperform 70% of players. ` +
    (top1 != null ? `Picks the strongest of five ${(top1 * 100).toFixed(1)}% of
      the time against 20% by chance: a real edge, not a reliable one. ` : "") +
    `Career figures are raw totals; the score shrinks them toward the population
     average, so a player with few games will show a career ACS that differs
     from their score component. Read-only — never writes to the game.`;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button.row");
  if (!b || !STATE) return;
  selected = b.dataset.puuid === selected ? null : b.dataset.puuid;
  render({status: "match", state: STATE, top1_rate: top1});
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && selected){
    selected = null;
    if (STATE) render({status: "match", state: STATE, top1_rate: top1});
  }
});

function connect(){
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("pulse").className = "pulse"; tries = 0; };
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => {
    $("pulse").className = "pulse off";
    tries++;
    // "disconnected" on its own is the least useful thing this can say. After
    // two failed attempts the likely cause is that nothing is listening at all
    // -- the page having been restored from cache -- so say that, and say what
    // to do about it. Guessing at this cost a real debugging session.
    $("sub").textContent = tries < 2 ? "reconnecting…"
      : "cannot reach the dashboard server";
    if (tries >= 2) $("stage").innerHTML = `<div class="idle">
      <b style="color:var(--bone)">The dashboard server is not running.</b><br><br>
      This page is still open, but nothing is listening on this port —
      most likely the window running it was closed, or it never started.<br><br>
      Start it again with <b>dashboard.bat</b>, and keep that window open
      while you use this page.</div>`;
    setTimeout(connect, 3000);
  };
}
connect();
</script>
</body>
</html>
